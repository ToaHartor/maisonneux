---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pre-pull

# Strategy: warm the shared zot cache before Flux rolls out new images.
# On pull_request to localdev (pre-merge, also validates that new refs
# are pullable) and on manual workflow_dispatch (on-demand warming), diff
# the rendered container images against the baseline with two full-tree
# `flate get images` renders (same full-tree strategy as the flate CI
# gate), then pull each new image through the cluster zot registry.
# Merges to localdev are covered by the PR run that precedes the merge,
# so no push trigger is needed. Zot's on-demand sync caches the image
# (S3-backed, shared by all nodes) so the Flux rollout no longer depends
# on a cold upstream fetch — which is what causes the ErrImagePull /
# ImagePullBackOff windows seen on digest-bump merges. Pattern follows
# the home-ops image pre-pull (onedr0p/home-ops ci.yaml
# image-pull-extract / image-pull jobs); here the fan-out happens through
# zot instead of spegel P2P: each new image is first pulled through a
# node's containerd with talosctl (which warms the shared zot cache via
# the node mirror chain), falling back to a direct pull through the zot
# service when the talosconfig mount is not available.

on:
  pull_request:
    branches:
      - localdev
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.number || forgejo.ref }}
  # PR runs may be superseded by newer commits; manual dispatch runs
  # (queued on the ref) must not cancel each other
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  filter:
    name: Image Pre-pull - Filter
    # PRs are gated on changed files so docs/infra-only PRs do not pay for
    # two full-tree renders; manual dispatch runs skip this job and
    # extract unconditionally
    if: ${{ forgejo.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: https://github.com/bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            kubernetes/**/*
            helm/**/*
            .forgejo/workflows/image-prepull.yaml

  extract:
    name: Image Pre-pull - Extract
    if: ${{ forgejo.event_name != 'pull_request' || needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # flate materializes the baseline tree from git history
          fetch-depth: 0
          # PR runs render the PR head commit (not the event's merge ref);
          # dispatch runs render the ref the dispatch was issued against
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.ref }}
          persist-credentials: false

      - name: Install flate
        uses: https://github.com/home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          # Forgejo-issued tokens are rejected by github.com (401) for
          # release downloads; flate is public, so force the unauthenticated
          # path.
          token: ""
          cache: false
          # Full-tree mode: empty base keeps FLATE_BASE unset, so `flate get`
          # renders the whole tree. The action's default is the repository
          # default branch (localdev): with FLATE_BASE set, every flate call
          # in the job silently runs in changed-only keep-set mode and
          # prunes unchanged subtrees (the psql-cluster dependsOn
          # not-found failure), and any -p into the .flate-base extract
          # directory gets cross-matched against it. Same settings as the
          # flate CI gate (.forgejo/workflows/flate.yaml).
          base: ""

      - name: Extract Changed Images
        id: extract
        run: |-
          set -euo pipefail
          OUT="${FORGEJO_OUTPUT:-$GITHUB_OUTPUT}"

          # Same flate strategy as the flate CI gate (.forgejo/workflows/
          # flate.yaml): two independent FULL-TREE renders (current tree and
          # baseline tree) diffed as plain lists — deliberately not
          # `flate diff images`: diff keep-set mode prunes unchanged subtrees
          # and blocks on the psql-cluster dependsOn edge when that folder is
          # unchanged, which is why the flate gate uses full-tree mode.
          # --allow-missing-kinds tolerates the runtime-created CRDs (absent
          # from the offline tree) that the flux-system flux-operator
          # ResourceSet depends on, keeping both renders green. If a render
          # still exits non-zero, a non-empty image list is fine; an empty
          # one is not.
          if [ "${{ forgejo.event_name }}" == "pull_request" ]; then
            # Render the PR head tree and diff against the PR base
            base="${{ forgejo.event.pull_request.base.sha }}"
          else
            # workflow_dispatch: no event baseline; diff against the
            # previous commit of the dispatched branch — the on-demand
            # equivalent of the merge-window warming the push trigger
            # used to cover
            base="$(git rev-parse HEAD~1)"
          fi

          # Materialize the baseline tree from the full-history checkout
          # (fetch-depth: 0 above) and render each tree in full
          mkdir -p .flate-base
          git archive "$base" | tar -x -C .flate-base
          # Anchor flate's source-root discovery to the extracted tree:
          # without a local .git, the walk reaches the workdir's repo and
          # the test cluster's relative Kustomization paths leak into the
          # main tree ("conflicting entry coordinates")
          git init -q .flate-base
          if ! flate get images -p ./kubernetes/clusters/test --allow-missing-kinds CustomResourceDefinition | sort -u > current.images; then
            echo "::warning::current tree: flate get exited non-zero (blocked resources); continuing with the image list"
          fi
          if ! flate get images -p .flate-base/kubernetes/clusters/test --allow-missing-kinds CustomResourceDefinition | sort -u > base.images; then
            echo "::warning::baseline tree: flate get exited non-zero (blocked resources); continuing with the image list"
          fi
          [ -s current.images ] || { echo "current tree rendered no images — refusing to pull"; exit 1; }
          [ -s base.images ] || { echo "baseline tree rendered no images — refusing to pull"; exit 1; }
          comm -13 base.images current.images > new.images
          rm -rf .flate-base

          # Build the JSON array output (no jq in the runner pod). With
          # no changed images the output is a single "none" placeholder:
          # an empty matrix leaves the pull/scan jobs incomplete on
          # Forgejo, while the 'none' entry runs as a green no-op (every
          # real step is guarded on matrix.image != 'none')
          if [ -s new.images ]; then
            json="["
            first=true
            while IFS= read -r img; do
              [ -n "$img" ] || continue
              if $first; then
                first=false
              else
                json="$json, "
              fi
              json="$json\"$img\""
            done < new.images
            json="$json]"
          else
            json="[\"none\"]"
          fi
          echo "$json" > images.json
          echo "Changed images:"
          cat images.json
          echo "images<<EOF" >> "$OUT"
          cat images.json >> "$OUT"
          echo "EOF" >> "$OUT"

  pull:
    name: Image Pre-pull - Pull
    # Runs whenever the extract succeeded. When no image changed, the
    # extract outputs a single "none" placeholder instead of an empty
    # list (an empty matrix leaves the job incomplete on Forgejo) and
    # every step below is guarded on the entry
    if: ${{ needs.extract.result == 'success' }}
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      # Bound concurrent zot on-demand sync fetches; one flaky image must
      # not sink the rest
      max-parallel: 4
      fail-fast: false
    env:
      # In-cluster zot service (same reference as tekton-pipelines); the
      # runner pods run in the services namespace
      ZOT_URL: http://zot.internal-ci.svc.cluster.local:5000
      # renovate: datasource=github-releases depName=google/go-containerregistry
      CRANE_VERSION: "0.22.1"
      # Pinned to the deployed Talos (terraform/k8s/nodes/variables.tf);
      # both live in the "Talos Linux" renovate group
      # renovate: datasource=github-releases depName=siderolabs/talos
      TALOS_VERSION: "1.14.2"
    steps:
      - name: Setup Mise
        # talosctl and crane are both provided by mise (the home-ops
        # pre-pull pattern); both backends accept the bare version
        # (no v prefix), so the renovate-managed envs work as-is
        if: ${{ matrix.image != 'none' }}
        uses: https://github.com/jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install: false

      - name: "Pre-unpack on node (fallback: warm zot cache)"
        if: ${{ matrix.image != 'none' }}
        # Best path (the home-ops pre-pull pattern): pull through the
        # node's containerd — which goes through the node's registry
        # mirror chain, so zot is warmed for every node too — and unpack
        # into the node's image store so the rollout there is a pure
        # no-op. talosctl comes from mise; --nodes targets the node the
        # job pod runs on ($NODE, downward API in the runner podspec)
        # and the talosconfig mounted at /var/run/secrets/talosconfig
        # (TALOSCONFIG env in the runner podspec, from the talosconfig
        # secret in services) supplies the credentials.
        #
        # The zot-only fallback lives in the same step on purpose: a
        # separate step gated by `if: ${{ failure() }}` never fired —
        # with continue-on-error the failed pre-unpack is reported as a
        # success to later steps, so failure() stayed false and the
        # warm step was silently skipped. In-shell fallback means a
        # failed pre-unpack (empty talosconfig mount, node API
        # unreachable, NODE unset before the podspec rolls out) still
        # warms the shared zot cache via crane (also from mise), so the
        # rollout pulls from the LAN. The step fails only when both
        # paths fail; for registries zot does not mirror there is
        # nothing to warm, so that skip stays a success.
        env:
          # matrix.image in env, not inlined in the run block: the value
          # flows from PR content through the flate render, so expanding
          # it into the shell (template-injection, zizmor audit) is a
          # code-injection risk; the runner sets env values without
          # shell re-expansion
          IMAGE: ${{ matrix.image }}
        run: |-
          set -uo pipefail
          image="$IMAGE"
          node="${NODE:-}"
          if [ -n "$node" ] && mise exec "talosctl@${TALOS_VERSION}" -- talosctl --nodes "$node" image pull "$image"; then
            echo "node pre-unpack succeeded on ${node}"
            exit 0
          fi
          if [ -z "$node" ]; then
            echo "::warning::NODE not set (runner podspec not yet rolled out); skipping node pre-unpack"
          else
            echo "::warning::node pre-unpack failed on ${node}; falling back to zot-only warm"
          fi
          # No registry host prefix means docker.io
          registry="${image%%/*}"
          if [[ ! "$registry" =~ [\.:] ]]; then
            image="docker.io/${image}"
            registry="docker.io"
          fi
          # Only registries zot mirrors can be warmed through zot; anything
          # else (self-hosted registries) is pulled directly by the nodes
          case "$registry" in
            docker.io|ghcr.io|quay.io|gcr.io|registry.k8s.io|nvcr.io|registry.gitlab.com) ;;
            *)
              echo "skipping zot warm: ${registry} is not mirrored by zot"
              exit 0
              ;;
          esac
          rest="${image#"$registry"/}"
          name="${rest%%[:@]*}"
          ref="${rest#"$name"}"
          echo "warming zot cache: ${image}"
          mise exec "crane@${CRANE_VERSION}" -- crane --insecure pull "${ZOT_URL}/${registry}/${name}${ref}"

  scan:
    name: Image Pre-pull - Scan
    # Vulnerability report for the images the pull job just warmed: the
    # findings land in the PR comment the AI reviewer reads. Runs
    # whenever the pull job succeeded; with no new images the matrix is
    # the 'none' no-op entry and the steps are skipped
    if: ${{ needs.pull.result == 'success' }}
    # extract must be listed too: the matrix references
    # needs.extract.outputs.images, which is only evaluable when extract
    # is a declared dependency
    needs:
      - extract
      - pull
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      ZOT_URL: http://zot.internal-ci.svc.cluster.local:5000
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: "0.76.2"
    steps:
      - name: Setup Mise
        # trivy is provided by mise (same pattern as the pull job's
        # talosctl/crane; the aqua backend serves the release binary)
        if: ${{ matrix.image != 'none' }}
        uses: https://github.com/jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install: false

      - name: Trivy scan
        if: ${{ matrix.image != 'none' }}
        # Scan what the pull job just warmed, so the scan is a LAN read of
        # the zot cache instead of an upstream fetch: registries zot
        # mirrors are scanned through the zot service (plain HTTP, hence
        # --insecure; the kaniko build registry localhost:32000 is zot's
        # own root path), self-hosted registries not mirrored by zot are
        # scanned from their upstream reference directly.
        #
        # Report-only, on purpose: each scan job posts its own sticky
        # PR comment (one per image, marker-tagged) that the AI reviewer
        # reads alongside the konflate diff. The GitHub-hosted
        # upload/download-artifact@v4 actions are not supported by
        # Gitea/Forgejo runners, so a single aggregated comment via a
        # shared artifact is not possible — per-image comments it is.
        # We deliberately do NOT block the merge on CVEs — for a home
        # cluster most published CVEs do not affect the actual exposure,
        # and a blocking critical gate red'd Renovate churn until
        # upstream shipped a fix. Restoring one is a one-line addition
        # of a second trivy invocation with --severity CRITICAL
        # --exit-code 1. A failed scan is a warning entry, not a job
        # failure.
        # trivy auto-downloads its vulnerability DB on first use (the
        # runner pods have the internet access the tool setup already
        # relies on).
        env:
          # matrix.image in env, not inlined in the run block: the value
          # flows from PR content through the flate render, so expanding
          # it into the shell (template-injection, zizmor audit) is a
          # code-injection risk; the runner sets env values without
          # shell re-expansion
          IMAGE: ${{ matrix.image }}
        run: |-
          set -uo pipefail
          image="$IMAGE"
          # No registry host prefix means docker.io
          registry="${image%%/*}"
          if [[ ! "$registry" =~ [\.:] ]]; then
            image="docker.io/${image}"
            registry="docker.io"
          fi
          rest="${image#"$registry"/}"
          name="${rest%%[:@]*}"
          ref="${rest#"$name"}"
          # Scan source: warm zot for mirrored registries, upstream
          # otherwise. trivy image references are scheme-less host:port
          # paths (unlike crane, which takes a URL) — strip the http://
          # from ZOT_URL; the plain-HTTP-ness is what --insecure is for
          zot_host="${ZOT_URL#http://}"
          insecure=""
          case "$registry" in
            docker.io|ghcr.io|quay.io|gcr.io|registry.k8s.io|nvcr.io|registry.gitlab.com)
              scan_ref="${zot_host}/${registry}/${name}${ref}"
              insecure="--insecure"
              ;;
            localhost:32000)
              scan_ref="${zot_host}/${name}${ref}"
              insecure="--insecure"
              ;;
            *)
              scan_ref="${image}"
              ;;
          esac
          echo "scanning ${scan_ref}"
          # Vulnerability findings only (no secret/misconfig/license noise);
          # JSON in, compact markdown section out. The jq program covers
          # both trivy's Results[].Vulnerabilities layout and the legacy
          # top-level .Vulnerabilities one.
          if mise exec "trivy@${TRIVY_VERSION}" -- trivy image $insecure --disable-telemetry --scanners vuln -f json -o report.json "${scan_ref}"; then
            total=$(jq -r 'def vulns: ((.Results // []) | map(.Vulnerabilities // []) | add) // (.Vulnerabilities // []); vulns | length' report.json)
            { # markdown section, one per image, merged by the summary job
              echo "### ${image}"
              if [ "$total" -eq 0 ]; then
                echo "- no findings"
              else
                counts=$(jq -r 'def vulns: ((.Results // []) | map(.Vulnerabilities // []) | add) // (.Vulnerabilities // []); [vulns[].Severity // "UNKNOWN"] | "\(map(select(. == "CRITICAL")) | length) critical, \(map(select(. == "HIGH")) | length) high, \(map(select(. == "MEDIUM")) | length) medium, \(map(select(. == "LOW")) | length) low, \(map(select(. == "UNKNOWN")) | length) unknown"' report.json)
                echo "- ${total} findings: ${counts}"
                echo
                echo "| Severity | CVE | Package | Version → Fixed |"
                echo "|---|---|---|---|"
                # rank: CRITICAL=0 HIGH=1 MEDIUM=2 LOW=3, everything
                # else (UNKNOWN, missing severity) = 4 (index() would
                # return null, and jq sorts nulls FIRST). Two-tier cap:
                # ALL critical/high rows are shown, then the remaining
                # slots up to 15 are filled with the rest — so a
                # critical is never hidden by the cap.
                jq -r 'def vulns: ((.Results // []) | map(.Vulnerabilities // []) | add) // (.Vulnerabilities // []); def rank: (.Severity // "") as $s | (["CRITICAL", "HIGH", "MEDIUM", "LOW"] | index($s)) // 4; (vulns | sort_by(rank)) as $all | ($all | map(select(rank <= 1))) as $top | (15 - ($top | length)) as $n | ($top + (($all | map(select(rank > 1))) | (if $n > 0 then .[0:$n] else [] end))) | .[] | "| \(.Severity // "UNKNOWN") | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion // "-") → \((.FixedVersion // "") | if . == "" then "-" else . end) |"' report.json
                # hidden = findings not shown = max(total-15, 0) -
                # max(critical_high_count-15, 0)
                hidden=$(jq -r 'def vulns: ((.Results // []) | map(.Vulnerabilities // []) | add) // (.Vulnerabilities // []); def rank: (.Severity // "") as $s | (["CRITICAL", "HIGH", "MEDIUM", "LOW"] | index($s)) // 4; (vulns) as $v | ([$v[] | select(rank <= 1)] | length) as $t | ([(($v | length) - 15), 0] | max) - ([$t - 15, 0] | max)' report.json)
                if [ "$hidden" -gt 0 ]; then
                  echo
                  echo "_(+ ${hidden} more findings — full list in the trivy JSON of the scan job)"
                fi
              fi
            } > scan-section.md
            echo "section written"
          else
            echo "::warning::trivy scan failed for ${scan_ref}; listed in the report as a scan error"
            {
              echo "### ${image}"
              echo "- trivy scan failed (see the scan job log)"
            } > scan-section.md
          fi
          rm -f report.json
          # section file stays in the shared job CWD (steps share the
          # workspace; RUNNER_TEMP is not guaranteed to match across
          # steps on this runner) — the post step picks it up

      # One sticky PR comment per scanned image, posted by the scan job
      # itself: the GitHub-hosted upload/download-artifact@v4 actions are
      # NOT supported by Gitea/Forgejo runners (GHESNotSupportedError), so
      # the artifact-based single-comment aggregation is off the table.
      # The marker is tag-only so digest bumps update the same comment
      # instead of stacking new ones.
      - name: Post PR comment
        if: ${{ matrix.image != 'none' }}
        env:
          # In-cluster Forgejo API + repo token (same auth the ai-review
          # workflow uses; the runner's default token lacks write access)
          API_URL: http://forgejo-http.services.svc.cluster.local:3000/
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ forgejo.repository }}
          PR: ${{ forgejo.event.pull_request.number }}
          IMAGE: ${{ matrix.image }}
        run: |-
          set -uo pipefail
          # tag-only marker (digests change on every digest-bump PR)
          image_tag="${IMAGE%@*}"
          marker="<!-- trivy-scan: ${image_tag} -->"
          section="scan-section.md"
          if [ ! -f "$section" ]; then
            echo "::warning::no scan section found (scan step did not produce it); skipping the PR comment"
            exit 0
          fi
          body="$(printf '%s\n\n## Trivy scan: %s\n\n' "$marker" "$IMAGE"; cat "$section")"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          # find-or-patch the sticky comment (marker-based, same pattern as
          # the flate gate's commented block); a failure only warns — the
          # report stays in the job log
          existing=$(curl -sf -H "Authorization: token ${TOKEN}" -H "Accept: application/json" \
            "${API_URL}api/v1/repos/${REPO}/issues/${PR}/comments?limit=50" \
            | jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | .id' | head -n1 || true)
          if [ -n "$existing" ]; then
            resp=$(curl -sS -f -X PATCH -H "Authorization: token ${TOKEN}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "$payload" "${API_URL}api/v1/repos/${REPO}/issues/${PR}/comments/${existing}" || echo '{"error":"patch failed"}')
          else
            resp=$(curl -sS -f -X POST -H "Authorization: token ${TOKEN}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "$payload" "${API_URL}api/v1/repos/${REPO}/issues/${PR}/comments" || echo '{"error":"post failed"}')
          fi
          echo "$resp" | head -c 500; echo
          if echo "$resp" | grep -q '"error"'; then
            echo "::warning::could not post/patch the trivy PR comment (non-blocking)"
            exit 0
          fi
  success:
    if: ${{ !cancelled() }}
    needs:
      - filter
      - extract
      - pull
      - scan
    name: Image Pre-pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
