---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

# Strategy: full-tree flate validation (see the `base: ""` input on the flate action).
# `flate test` renders the entire production tree instead of a changed-only keep-set,
# which eliminates the psql-cluster dependsOn not-found block on fresh app PRs.
# Cost: every kubernetes/** PR gates on the whole tree being green (the psql-cluster
# chart is kept self-contained and cert-manager-webhook-ovh carries schema fallbacks
# for that reason).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - localdev

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.number || forgejo.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: https://github.com/bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            kubernetes/**/*
            .forgejo/workflows/flate.yaml
  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    # name: Flate - Test ${{ matrix.resource }}
    name: Flate - Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # We point to a fake Kustomization that renders fake secrets/configmaps and creates another Kustomization that points at the production stack
      FLATE_PATH: ./kubernetes/clusters/test # Used in all flate commands instead of --path <path>
      FLATE_OUTPUT: gitea
    # strategy:
    #   matrix:
    #     resource:
    #       - helmrelease
    #       - kustomization
    #   fail-fast: false
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all history for all branches and tags
          persist-credentials: false

      - name: Install flate
        uses: https://github.com/home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          # Defaults to ${{ github.token }} — a Forgejo-issued token that github.com
          # rejects (401). flate's release is public, so force the unauthenticated path.
          token: ""
          cache: false
          # Full-tree mode: empty base keeps FLATE_BASE unset, so `flate test`
          # renders the whole tree instead of a changed-only keep-set.
          base: ""

      - name: Run flate test
        run: |-
          # --allow-missing-kinds: tolerate the runtime-created CRDs (absent from the
          # offline tree) that the flux-system flux-operator ResourceSet depends on
          flate test all --log-level "debug" --allow-missing-kinds CustomResourceDefinition

      # The flate diff step was dropped with the full-tree switch: flate diff
      # requires a baseline (FLATE_BASE / --path-orig), and konflate already
      # posts a rendered-diff summary to the PR.

      # ! No longer needs to add a comment since konflate already posts the summary

      # - name: Add Comment
      #   if: ${{ steps.diff.outputs.diff != '' }}
      #   env:
      #     GH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      #     PR_NUMBER: ${{ forgejo.event.pull_request.number }}
