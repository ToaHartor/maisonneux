---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labeler

on:
  workflow_dispatch:
  # pull_request (not pull_request_target): the labeler only runs a
  # digest-pinned action against a config file from the base repo and
  # needs no secrets, so the safe non-target trigger is sufficient
  # (zizmor flags pull_request_target as a dangerous trigger)
  pull_request:
    branches: ["localdev"]

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Labeler
        uses: https://github.com/actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .forgejo/labeler.yaml
