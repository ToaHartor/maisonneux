---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
spec:
  releaseName: tekton-operator
  chartRef:
    kind: OCIRepository
    name: tekton-operator
  interval: 50m
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
    strategy:
      name: RetryOnFailure # retry failed upgrades instead of rollback
      retryInterval: 5m
  upgrade:
    crds: CreateReplace

  postRenderers:
    - kustomize:
        patches:
          # Set the OpenTelemetry metrics protocol (operator v0.80.0+ migrated from
          # OpenCensus; metrics.backend-destination was replaced by metrics-protocol,
          # which defaults to "none" and would stop operator metrics export)
          # https://tekton.dev/docs/pipelines/metrics-migration-otel/
          - target:
              version: v1
              kind: ConfigMap
              name: tekton-operator-observability
            patch: |
              - op: add
                path: /data/metrics-protocol
                value: prometheus

  values:
    # see https://github.com/tektoncd/operator/blob/main/charts/tekton-operator/values.yaml
    installCRDs: true
    # tektonconfig,tektonpipeline,tektontrigger,tektonhub,tektonchain,tektonresult,tektondashboard,manualapprovalgate
    controllers: "tektonconfig,tektonpipeline,tektontrigger,tektonhub,tektonchain,tektondashboard,manualapprovalgate"
    operator:
      defaultTargetNamespace: internal-ci

    podSecurityContext:
      fsGroup: 2000

    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    service:
      createServiceMonitor: true
