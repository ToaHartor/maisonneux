---
# TektonConfig is the operator-managed config CR (the operator only creates it when absent,
# and version upgrades just bump the release-version label — user spec is respected).
#
# Tekton operator v0.81.0+ creates default-deny NetworkPolicies for component workloads
# (https://github.com/tektoncd/operator/blob/main/docs/NetworkPolicy.md).
# Opt out via networkPolicy.disabled: the operator removes all managed policies on the
# next reconcile. TektonConfig is the source of truth for this field — edits on the
# per-component CRs (TektonPipeline, TektonTrigger, ...) are overwritten on the next
# config reconcile.
#
# Two-step rollout: the v0.79.1 operator's admission webhook rejects the new
# networkPolicy field ("unknown field"), and the failed Kustomization blocks the very
# upgrade that would deploy the 0.81.2 webhook — a chicken-and-egg. So this object
# first lands WITHOUT networkPolicy (byte-identical to the live operator-created spec,
# accepted by the v0.79.1 webhook), letting the operator upgrade to 0.81.2 (new CRDs +
# webhook). A follow-up commit then adds `networkPolicy: {disabled: true}`, which the
# 0.81.2 webhook accepts and the operator acts on by removing the managed policies.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: all
  targetNamespace: internal-ci
  # networkPolicy: {disabled: true} — step 2 of the rollout: add this once the
  # operator is at v0.81.2 (its webhook + CRD know the field).
  addon: {}
  chain:
    "artifacts.oci.format": simplesigning
    "artifacts.oci.storage": oci
    "artifacts.pipelinerun.format": in-toto
    "artifacts.pipelinerun.storage": oci
    "artifacts.taskrun.format": in-toto
    "artifacts.taskrun.storage": oci
    disabled: false
    options: {}
    performance:
      "disable-ha": false
  config: {}
  dashboard:
    options: {}
    readonly: false
  hub:
    options: {}
  multiclusterProxyAAE:
    options: {}
  pipeline:
    "await-sidecar-readiness": true
    coschedule: workspaces
    "disable-creds-init": false
    "enable-api-fields": beta
    "enable-bundles-resolver": true
    "enable-cel-in-whenexpression": false
    "enable-cluster-resolver": true
    "enable-custom-tasks": true
    "enable-git-resolver": true
    "enable-hub-resolver": true
    "enable-param-enum": false
    "enable-provenance-in-status": true
    "enable-step-actions": true
    "enforce-nonfalsifiability": none
    "keep-pod-on-cancel": false
    "max-result-size": 4096
    "metrics.count.enable-reason": false
    "metrics.pipelinerun.duration-type": histogram
    "metrics.pipelinerun.level": pipeline
    "metrics.taskrun.duration-type": histogram
    "metrics.taskrun.level": task
    options: {}
    performance:
      "disable-ha": false
    "require-git-ssh-secret-known-hosts": false
    "results-from": termination-message
    "running-in-environment-with-injected-sidecars": true
    "send-cloudevents-for-runs": false
    "set-security-context": false
    "trusted-resources-verification-no-match-policy": ignore
  platforms:
    openshift: {}
  pruner:
    disabled: false
    keep: 100
    resources:
      - pipelinerun
    schedule: "0 8 * * *"
  result:
    disabled: false
    "is_external_db": false
    options: {}
    performance:
      "disable-ha": false
    route_enabled: false
    route_tls_termination: edge
  scheduler:
    "config.yaml":
      cel: {}
    "multi-cluster-disabled": false
    "multi-cluster-role": ""
    options: {}
  tektonpruner:
    disabled: true
    global-config:
      enforcedConfigLevel: global
      historyLimit: 100
    options: {}
  trigger:
    disabled: false
    "enable-api-fields": stable
    options: {}
