---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
spec:
  releaseName: zot
  chart:
    spec:
      chart: zot
      version: "0.1.134"
      sourceRef:
        kind: HelmRepository
        name: zot
  interval: 50m
  install:
    createNamespace: true
    remediation:
      retries: 3
  timeout: 15m # Should wait until the database is rebuilt
  values:
    # https://github.com/project-zot/helm-charts/blob/main/charts/zot/values.yaml
    deploymentAnnotations:
      # Reload pod on secret/cm change
      reloader.stakater.com/auto: "true"
    priorityClassName: services-critical
    env:
      - name: "AWS_ACCESS_KEY_ID"
        valueFrom:
          secretKeyRef:
            name: &s3user ${S3_USER}-garage
            key: accessKey
      - name: "AWS_SECRET_ACCESS_KEY"
        valueFrom:
          secretKeyRef:
            name: *s3user
            key: secretKey

    replicaCount: 1
    # Persist zot's metadata DBs (boltdb catalog, search/scrub caches) on a PVC:
    # image blob content stays in Garage S3, only rootDirectory state is local.
    # Without this the pod re-scans the whole S3 bucket on every restart.
    persistence: true
    pvc:
      storage: 10Gi
      storageClassName: ${fastdata_storage}
    resources:
      limits:
        cpu: 2
        memory: 4Gi # GC/dedupe-restore sweeps over the 136-repo catalog need >1Gi or the pod OOMKills in a restart loop
      requests:
        cpu: 100m
        memory: 100Mi
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    # Adjust startup probe to take into account the repository scan
    startupProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      failureThreshold: 15
    service:
      type: NodePort
      nodePort: 32000
    metrics:
      enabled: true

    mountConfig: true
    configFiles:
      config.json: |-
        {
          "distSpecVersion": "1.1.0",
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "dedupe": false,
            "remoteCache": false,
            "fastRestart": true,
            "gc": true,
            "gcDelay": "2h",
            "gcInterval": "24h",
            "retention": {
              "policies": [
                {
                  "repositories": ["**"],
                  "keepUntagged": {
                    "mostRecentlyPulledCount": 500,
                    "pulledWithin": "168h",
                    "pushedWithin": "168h"
                  }
                }
              ]
            },
            "storageDriver": {
              "name": "s3",
              "region": "${GARAGE_REGION}",
              "regionendpoint": "http://${GARAGE_URL}",
              "bucket": "${BUCKET_NAME}",
              "forcepathstyle": true,
              "secure": false,
              "skipverify": false
            }
          },
          "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "compat": ["docker2s2"]
          },
          "extensions": {
            "ui": {
              "enable": true
            },
            "search": {
              "enable": true
            },
            "metrics": {
              "enable": true,
              "prometheus": {
                "path": "/metrics"
              }
            },
            "scrub": {
              "interval": "24h"
            },
            "sync": {
              "enable": true,
              "downloadDir": "/var/lib/registry/mirror",
              "registries": [
                {
                  "urls": [
                    "https://index.docker.io"
                  ],
                  "content": [
                    {
                      "destination": "/docker.io",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": [
                    "https://registry.gitlab.com"
                  ],
                  "content": [
                    {
                      "destination": "/registry.gitlab.com",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": [
                    "https://ghcr.io"
                  ],
                  "content": [
                    {
                      "destination": "/ghcr.io",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": [
                    "https://quay.io"
                  ],
                  "content": [
                    {
                      "destination": "/quay.io",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": [
                    "https://gcr.io"
                  ],
                  "content": [
                    {
                      "destination": "/gcr.io",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": [
                    "https://registry.k8s.io"
                  ],
                  "content": [
                    {
                      "destination": "/registry.k8s.io",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": [
                    "https://nvcr.io"
                  ],
                  "content": [
                    {
                      "destination": "/nvcr.io",
                      "prefix": "**"
                    }
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                }
              ]
            }
          },
          "log": { "level": "debug" }
        }
