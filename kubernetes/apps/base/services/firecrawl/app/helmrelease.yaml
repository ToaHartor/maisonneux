---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app firecrawl
spec:
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 50m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # From https://github.com/tyriis/home-ops/blob/main/kubernetes/main/apps/firecrawl-system/firecrawl/app/helm-release.yaml
    # based on https://github.com/firecrawl/firecrawl/tree/main/examples/kubernetes/cluster-install
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    controllers:
      api:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/firecrawl
              tag: 2.11@sha256:5c93f56d175b4722074f598c1688c5340f249999c480e81c02f5ce4a45b893a6
            command: ["node", "--max-old-space-size=6144", "dist/src/index.js"]
            env:
              FLY_PROCESS_GROUP: app
              PORT: "3002"
              REDIS_URL: redis://dragonfly-cluster.dragonfly.svc.cluster.local:6379/8
              REDIS_RATE_LIMIT_URL: redis://dragonfly-cluster.dragonfly.svc.cluster.local:6379/8
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.services.svc.cluster.local:3000/scrape #NOSONAR allow http
              USE_DB_AUTHENTICATION: "false"
              SEARXNG_ENDPOINT: http://searxng.services.svc.cluster.local:8080
              BULL_AUTH_KEY:
                secretKeyRef:
                  name: ${SECRET_KEY_NAME}
                  key: secretKey
              ENV: production
              LOGGING_LEVEL: INFO
              IS_KUBERNETES: "true"
              HOST: 0.0.0.0
            envFrom:
              - secretRef:
                  name: ${CREDS_SECRET_NAME}
            ports:
              - name: http
                containerPort: 3002
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v0/health/liveness
                    port: 3002
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v0/health/readiness
                    port: 3002
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 750Mi
              # limits:
              #   memory: 6Gi

      worker:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/firecrawl
              tag: 2.11@sha256:5c93f56d175b4722074f598c1688c5340f249999c480e81c02f5ce4a45b893a6
            command: ["node", "--max-old-space-size=3072", "dist/src/services/queue-worker.js"]
            env:
              FLY_PROCESS_GROUP: worker
              PORT: "3005"
              REDIS_URL: redis://dragonfly-cluster.dragonfly.svc.cluster.local:6379/8
              REDIS_RATE_LIMIT_URL: redis://dragonfly-cluster.dragonfly.svc.cluster.local:6379/8
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.services.svc.cluster.local:3000/scrape #NOSONAR allow http
              SEARXNG_ENDPOINT: http://searxng.services.svc.cluster.local:8080
              BULL_AUTH_KEY:
                secretKeyRef:
                  name: ${SECRET_KEY_NAME}
                  key: secretKey
              USE_DB_AUTHENTICATION: "false"
              ENV: production
              LOGGING_LEVEL: INFO
              IS_KUBERNETES: "true"
              HOST: 0.0.0.0
            envFrom:
              - secretRef:
                  name: ${CREDS_SECRET_NAME}
            ports:
              - name: http
                containerPort: 3005
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /liveness
                    port: 3005
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 500Mi
              # limits:
              #   cpu: 1
              #   memory: 4Gi

      nuq-worker:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/firecrawl
              tag: 2.11@sha256:5c93f56d175b4722074f598c1688c5340f249999c480e81c02f5ce4a45b893a6
            command: ["node", "--max-old-space-size=3072", "dist/src/services/worker/nuq-worker.js"]
            env:
              FLY_PROCESS_GROUP: nuq
              NUQ_WORKER_PORT: "3006"
              REDIS_URL: redis://dragonfly-cluster.dragonfly.svc.cluster.local:6379/8
              REDIS_RATE_LIMIT_URL: redis://dragonfly-cluster.dragonfly.svc.cluster.local:6379/8
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.services.svc.cluster.local:3000/scrape #NOSONAR allow http
              SEARXNG_ENDPOINT: http://searxng.services.svc.cluster.local:8080
              BULL_AUTH_KEY:
                secretKeyRef:
                  name: ${SECRET_KEY_NAME}
                  key: secretKey
              USE_DB_AUTHENTICATION: "false"
              ENV: production
              LOGGING_LEVEL: INFO
              IS_KUBERNETES: "true"
              HOST: 0.0.0.0
            envFrom:
              - secretRef:
                  name: ${CREDS_SECRET_NAME}
            ports:
              - name: http
                containerPort: 3006
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3006
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 500Mi
              # limits:
              #   cpu: 1
              #   memory: 4Gi

      playwright-service:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/playwright-service
              tag: latest@sha256:df1a393ce8bfc3801570a826a9b0dcc400ae48789adb4a0ad9d6cbf0229b059b
            env:
              PORT: "3000"
              BLOCK_MEDIA: "true"
              MAX_CONCURRENT_PAGES: "10"
            ports:
              - name: http
                containerPort: 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              # limits:
              #   cpu: 1
              #   memory: 4Gi

      nuq-postgres:
        replicas: 1
        pod:
          securityContext:
            fsGroup: 999
        initContainers:
          init-permissions:
            image:
              repository: ghcr.io/firecrawl/nuq-postgres
              tag: latest@sha256:4ca6718b2cef40404b046db5cd37ae45db3e44d1a5750c80522f3587a5b193d5
            securityContext:
              runAsUser: 0
            command:
              - chown
              - -R
              - "999:999"
              - /var/lib/postgresql/data
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/nuq-postgres
              tag: latest@sha256:4ca6718b2cef40404b046db5cd37ae45db3e44d1a5750c80522f3587a5b193d5
            env:
              POSTGRES_USER: ${PSQL_DB_USER}
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ${CREDS_SECRET_NAME}
                    key: NUQ_DATABASE_PASSWORD

              POSTGRES_DB: ${PSQL_DB_NAME}
            ports:
              - name: postgres
                containerPort: 5432
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi

    service:
      api:
        controller: api
        ports:
          http:
            port: 3002
      nuq-postgres:
        controller: nuq-postgres
        ports:
          postgres:
            port: 5432
      playwright:
        controller: playwright-service
        ports:
          http:
            port: 3000

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      nodecache:
        type: emptyDir
        advancedMounts:
          playwright-service:
            app:
              - path: /home/node

      data:
        type: emptyDir
        advancedMounts:
          nuq-postgres:
            init-permissions:
              - path: /var/lib/postgresql/data
            app:
              - path: /var/lib/postgresql/data
