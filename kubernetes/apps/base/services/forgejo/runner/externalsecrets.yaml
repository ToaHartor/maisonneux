---
# Source: external-talosconfig (external-secrets namespace), created by
# the terraform/fluxcd bootstrap by reading the talosconfig output of the
# k8s nodes state (same-named workspace) — no variable to maintain.
# Until that secret exists this ExternalSecret stays pending and the
# runner's optional volume mount is empty, so the image-prepull
# workflow degrades to the zot-only warm path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talosconfig
spec:
  data:
    - secretKey: talosconfig
      remoteRef:
        key: external-talosconfig
        property: talosconfig
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        talosconfig: "{{ .talosconfig }}"
      engineVersion: v2
