---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-runner
spec:
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  # From https://git.erwanleboucher.dev/eleboucher/homelab/src/branch/main/kubernetes/apps/forgejo/forgejo-runner/app/helmrelease.yaml
  # https://git.erwanleboucher.dev/eleboucher/runner-k8s-plugin/src/branch/main/charts/forgejo-runner/values.yaml
  values:
    forgejo:
      url: https://${SUBDOMAIN}.${DOMAIN_WEBSECURE}
      existingSecret: forgejo-runner-secret
    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.1.0"
      digest: "sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952"
    plugin:
      image:
        repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: 13.1.0
        digest: sha256:9ae8a21340cde415b828adc95bc4f1345bed67c21a0e3be26032d367a64b20db
    podLabels:
      app.kubernetes.io/component: forgejo-runner
    runnerConfig: |
      cache:
        enabled: true
        dir: /data/cache
        port: 8088
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      kubernetes:
        namespace: services
        poll_timeout: 10m
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: services
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance"
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      runner:
        capacity: 3
        labels:
          - ubuntu-latest:k8s:///config/podspec-default.yaml
          - default:k8s:///config/podspec-default.yaml
          - docker:k8s:///config/podspec-dind.yaml
          # - multiarch:k8s:///config/podspec-dind.yaml  # you need binfmt-misc extension for multiarch
          # - heavy:k8s:///config/podspec-heavy.yaml  # long compiles (webkitgtk); see podspec-heavy
        # Ceiling for every job, not a target. webkitgtk needs ~1.5-4h and the
        # previous 3h cut it too fine; ordinary jobs are unaffected.
        timeout: 8h
        shutdown_timeout: 3m
    podSpecs:
      podspec-default.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 4Gi
        restartPolicy: Never
      podspec-heavy.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              # Burstable on purpose: at 36Gi request=limit this held
              # oom_score_adj -997 and the kernel killed postgres instead of it.
              requests:
                cpu: "4"
                memory: 8Gi
                ephemeral-storage: 40Gi
              limits:
                cpu: "12"
                memory: 24Gi
                ephemeral-storage: 60Gi
            volumeMounts:
              # $BUILDDIR: the plugin's own "shared" workdir is capped at 10Gi.
              - name: build
                mountPath: /build
        volumes:
          - name: build
            emptyDir:
              sizeLimit: 40Gi
        restartPolicy: Never
      podspec-dind.yaml: |
        initContainers:
          - name: dind
            image: docker:29-dind
            args:
              - --ipv6
              - --fixed-cidr-v6=fd00:d1d::/64
            securityContext:
              privileged: true
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 8Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
            startupProbe:
              exec:
                command:
                  - sh
                  - -c
                  - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
              initialDelaySeconds: 5
              periodSeconds: 1
              failureThreshold: 30
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 4Gi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
        restartPolicy: Never
