---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app obsidian-livesync
spec:
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  maxHistory: 2
  interval: 50m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: services-important
    controllers:
      obsidian-couchdb:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        pod:
          securityContext:
            fsGroup: 5984
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 5984
            runAsUser: 5984
        initContainers:
          init-config:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - "/bin/sh"
              - "-c"
              - "cp /tmp/config/*.ini /opt/couchdb/etc/default.d/; ls -lrt /opt/couchdb/etc/default.d;"
        containers:
          app:
            image:
              repository: docker.io/library/couchdb
              tag: 3.5.2@sha256:7feb744b60195233219f3fa801cbc2384efa24b28c76a5d1f3e93efe6557f921
            env:
              COUCHDB_USER:
                valueFrom:
                  secretKeyRef:
                    name: ${SECRET_CREDS_NAME}
                    key: username
              COUCHDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ${SECRET_CREDS_NAME}
                    key: password
            ports:
              - containerPort: &httpPort 5984
                name: http
                protocol: TCP
            probes:
              # The WebUI also serves GET /_up on :5984, but apparently it requires authentication
              liveness: &probe
                enabled: true
                type: TCP
                port: *httpPort
                spec:
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe

            resources:
              requests:
                cpu: 15m
                memory: 200Mi
              limits:
                memory: 200Mi
          mcp:
            image:
              repository: ghcr.io/es617/obsidian-sync-mcp
              tag: v0.6.1@sha256:be8651deb627b5452af1f017d909c159d135f9906d0850789759cfa71f8bb213
            env:
              DATA_DIR: /data/couchdb/mcpserver
              COUCHDB_URL: http://localhost:5984
              COUCHDB_USER:
                valueFrom:
                  secretKeyRef:
                    name: ${SECRET_CREDS_NAME}
                    key: username
              COUCHDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ${SECRET_CREDS_NAME}
                    key: password
              COUCHDB_DATABASE: obsidian
              VAULT_NAME: Docs # Change depending on the vault name
              # If e2e is enabled
              # COUCHDB_PASSPHRASE:
              #   value: passphrase
              COUCHDB_OBFUSCATE_PROPERTIES: "false"
              # We don't enable password auth as it is covered by litellm
              # MCP_AUTH_TOKEN: password
              MCP_ALLOWED_HOSTS: obsidian-livesync.services.svc.cluster.local
              BASE_URL: http://obsidian-livesync.services.svc.cluster.local:8787 # https://${SUBDOMAIN}.${DOMAIN_WEBSECURE}
            ports:
              - containerPort: &mcpPort 8787
                name: http
                protocol: TCP
            probes:
              # The WebUI serves an unauthenticated GET /health on :8787.
              liveness: &probe
                enabled: true
                type: TCP
                port: *mcpPort
                spec:
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe

            resources:
              requests:
                cpu: 15m
                memory: 75Mi
              limits:
                memory: 150Mi
    service:
      app:
        controller: obsidian-couchdb
        ports:
          http:
            port: *httpPort
          mcp:
            port: *mcpPort

    route:
      app:
        enabled: true
        parentRefs:
          - kind: Gateway
            name: traefik-gateway
            namespace: ingress
            sectionName: websecure
        hostnames:
          - ${SUBDOMAIN}.${DOMAIN}
        rules:
          # - matches:
          #     - path:
          #         type: PathPrefix
          #         value: /mcp
          #   backendRefs:
          #     - name: *app
          #       port: *mcpPort
          #   filters:
          #     - type: ExtensionRef
          #       extensionRef:
          #         group: traefik.io
          #         kind: Middleware
          #         name: obsidian-cors-headers
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: *app
                port: *httpPort
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: obsidian-cors-headers

    persistence:
      config:
        type: configMap
        name: &configMap obsidian-couchdb-configmap
        advancedMounts:
          obsidian-couchdb:
            init-config:
              - path: /tmp/config
      config-storage:
        type: emptyDir
        globalMounts:
          - path: /opt/couchdb/etc/default.d
      data:
        forceRename: obsidian-couchdb
        labels:
          homelab/backup-resource: "true"
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ${fastdata_storage}-ha
        advancedMounts:
          obsidian-couchdb:
            app:
              - path: /opt/couchdb/data
            mcp:
              - path: /data/couchdb
      tmpfs:
        type: emptyDir
        advancedMounts:
          obsidian-couchdb:
            mcp:
              - path: /.obsidian-mcp

    configMaps:
      config:
        forceRename: *configMap
        data:
          config.ini: |-
            [couchdb]
            single_node = true
            max_document_size = 50000000

            [chttpd]
            require_valid_user = true
            bind_address = any
            max_http_request_size = 4294967296
            enable_cors = true

            [chttpd_auth]
            require_valid_user = true
            authentication_redirect = /_utils/session.html

            [httpd]
            WWW-Authenticate = Basic realm="couchdb"
            enable_cors = true

            [cors]
            origins = app://obsidian.md,capacitor://localhost,http://localhost
            credentials = true
            headers = accept, authorization, content-type, origin, referer
            methods = GET, PUT, POST, HEAD, DELETE
            max_age = 86400
