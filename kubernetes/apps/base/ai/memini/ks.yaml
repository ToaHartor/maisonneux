---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini
spec:
  dependsOn:
    - name: litellm-resources
  commonMetadata:
    labels:
      app.kubernetes.io/name: memini
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: memini
      namespace: ai
  interval: 1h
  components:
    # relative to spec.path
    - ../../../../../common/components/cnpg/db
    - ../../../../../common/components/httproute/common
    - ../../../../../common/components/secret/key
  path: "./kubernetes/apps/base/ai/memini/app"
  postBuild:
    substitute:
      APP: memini
      SUBDOMAIN: memini
      DOMAIN: ${main_domain}
      DOMAIN_WEBSECURE: ${main_domain_websecure}
      # Database settings
      PSQL_DB_USER: memini
      PSQL_DB_NAME: memini
      DATABASE_EXTENSIONS: |
        [
          { name: vector, ensure: present },
          { name: vchord, ensure: present }
        ]
      ## API key
      SECRET_KEY_NAME: memini-api-key
      SECRET_KEY_TYPE: 64hexa
      # HTTPRoute
      GATEWAY_SVC_NAME: memini
      GATEWAY_SVC_PORT: "8080"
      # inherited variables
      psql_database_namespace: ${psql_database_namespace}
      psql_cluster_name: ${psql_cluster_name}
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 10m
