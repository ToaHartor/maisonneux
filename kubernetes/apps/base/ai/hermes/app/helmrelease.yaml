---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  releaseName: *app
  dependsOn:
    - name: ${APP}-oidc
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 50m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
    strategy:
      name: RetryOnFailure # retry failed upgrades instead of rollback
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      # terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1024
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1024
        runAsUser: 1024
        seccompProfile:
          type: RuntimeDefault

    controllers:
      # Example in docker compose : https://github.com/nesquena/hermes-webui/blob/master/docker-compose.two-container.yml
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          copy-agent-source:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # hermes-agent >= v2026.7.x ships root-only playwright .deps files;
                # tolerate those but still fail on any other copy error.
                cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
                test -e /agent-src/.venv
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024
              runAsUser: 1024
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp /run/config/config.yaml /opt/data/config.yaml
                # cp /run/config/env /opt/data/.env
                # chmod 600 /opt/data/.env
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024
              runAsUser: 1024

          install-tools:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # mkdir -p /opt/data/.local/bin /opt/data/.local/go

                # rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                # if [ ! -f /opt/data/.local/bin/gh ]; then
                #   cd /tmp
                #   curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                #   tar xzf gh.tar.gz
                #   cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                #   rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                # fi

                # if [ ! -f /opt/data/.local/go/bin/go ]; then
                #   cd /tmp
                #   curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                #   tar xzf go.tar.gz
                #   mv go /opt/data/.local/
                #   rm -rf go.tar.gz
                # fi

                # if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                #   export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                #   mkdir -p $HOMEBREW_PREFIX
                #   git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                # fi
                echo "Installation complete"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024

        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            args:
              - gateway
              - run
              - --no-supervise
            env:
              # Some settings can be overriden by env variables :
              # https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example
              # https://github.com/nousresearch/hermes-agent/blob/main/website/docs/reference/environment-variables.md
              TZ: Europe/Paris
              HERMES_HOME: /opt/data
              HERMES_CRON_TIMEOUT: 0
              HOME: /opt/data
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_KEY:
                secretKeyRef:
                  name: ${SECRET_KEY_NAME}
                  key: secretKey
              API_SERVER_CORS_ORIGINS: "*"
              HERMES_UID: 1024
              HERMES_GID: 1024
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://${SUBDOMAIN}.${DOMAIN_WEBSECURE}
              # OIDC
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientID
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientSecret
              HERMES_DASHBOARD_OIDC_SCOPES: openid profile email
              HERMES_DASHBOARD_OIDC_ISSUER:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: issuerURL
              LITELLM_API_KEY:
                secretKeyRef:
                  name: litellm-master-key
                  key: secretKey
              MEMINI_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-api-key
                    key: secretKey
              FIRECRAWL_API_URL: http://firecrawl-api.services.svc.cluster.local:3002/v2/scrape
              FIRECRAWL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: firecrawl-api-key
                    key: secretKey
            ports:
              - containerPort: &apiPort 8642
                name: api
                protocol: TCP
              - containerPort: *dashboardPort
                name: dashboard
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/status
                    port: *dashboardPort
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
          webui:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.130@sha256:fee263b03dcc6f9421686a5baf11595d1aeaf2879854626c1484c273f20875e5
            # From https://github.com/WOOWTECH/Woow_hermes_agent_docker_compose_all/blob/main/deploy/k3s/manifests/06-hermes.yaml
            # command: [sh, -c]
            # args:
            #   - |
            #     mkdir -p /home/hermeswebui/.hermes
            #     # echo "LITELLM_API_KEY=$${LITELLM_API_KEY}" > /home/hermeswebui/.hermes/.env
            #     # chmod 644 /home/hermeswebui/.hermes/.env

            #     for i in $(seq 1 90); do
            #       HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8642/ 2>/dev/null)
            #       [ "$HTTP" = "200" ] || [ "$HTTP" = "404" ] && break
            #       sleep 2
            #     done

            #     (while true; do
            #       NOW=$(python3 -c "from datetime import datetime,timezone;print(datetime.now(timezone.utc).isoformat())")
            #       printf '{"gateway_state":"running","updated_at":"%s","pid":1,"platform":"hermes-agent","version":"0.13.0"}\n' "$NOW" > /home/hermeswebui/.hermes/gateway_state.json 2>/dev/null
            #       sleep 25
            #     done) &

            #     rm -f /home/hermeswebui/.hermes/.skills_prompt_snapshot.json 2>/dev/null

            #     if [ -f /hermeswebui_init.bash ]; then
            #       sed -i 's/chmod 700 "$itdir"/chmod 755 "$itdir"/' /hermeswebui_init.bash 2>/dev/null
            #       # sed -i '/cd \/app; python server.py/i test -f /home/hermeswebui/.hermes/replace_icons.sh \&\& sh /home/hermeswebui/.hermes/replace_icons.sh 2>/dev/null || true' /hermeswebui_init.bash 2>/dev/null
            #       exec /hermeswebui_init.bash
            #     else
            #       echo "WebUI init script not found, sleeping..."
            #       sleep infinity
            #     fi
            env:
              # PLAYWRIGHT_BROWSERS_PATH: /opt/data/playwright-browsers
              # LD_LIBRARY_PATH: /opt/shared-tools/lib
              # PATH: "/opt/shared-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              WANTED_UID: 1024
              WANTED_GID: 1024
              GATEWAY_HEALTH_URL: http://localhost:8642
              HERMES_HOME: /home/hermeswebui/.hermes
              HERMES_WEBUI_AGENT_DIR: /home/hermeswebui/.hermes/hermes-agent
              HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
              HERMES_WEBUI_HOST: 0.0.0.0
              HERMES_WEBUI_PORT: &webuiPort 8787
              HERMES_WEBUI_CHAT_BACKEND: gateway
              HERMES_WEBUI_GATEWAY_BASE_URL: http://hermes.ai.svc.cluster.local:8642
              HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
              HERMES_WEBUI_GATEWAY_API_KEY:
                secretKeyRef:
                  name: hermes-api-key
                  key: secretKey
              # HERMES_WEBUI_PASSWORD:
              # OIDC config
              # https://github.com/nesquena/hermes-webui/blob/704e19adfe74e4fa4dd0067c390c21f74d786779/api/auth_oidc.py#L172
              HERMES_WEBUI_OIDC_ISSUER:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: issuerURL
              HERMES_WEBUI_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientID
              HERMES_WEBUI_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientSecret
              HERMES_WEBUI_OIDC_REDIRECT_URI:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: redirectURL
              HERMES_WEBUI_OIDC_SCOPES: openid profile email groups
              HERMES_WEBUI_OIDC_ALLOW_CLAIM: groups
              HERMES_WEBUI_OIDC_ALLOW_VALUES: "app: hermes" # Group to allow, should correspond to the property mapping patch
              # test
              # HERMES_SKIP_CHMOD: 1
            ports:
              - containerPort: *webuiPort
                name: http
                protocol: TCP
            probes:
              # The WebUI serves an unauthenticated GET /health on :8787.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *webuiPort
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              # First boot (and every pod start — the venv lives on the ephemeral
              # image layer, not the PVC) builds a Python venv via `uv pip install`
              # before /health answers, so gate liveness/readiness on a generous
              # startup probe (~5 min) instead of a long initialDelaySeconds.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *webuiPort
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # The entrypoint seeds /app and builds the venv on the writable
              # image layer, so the root FS cannot be read-only.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              # runAsGroup: 0
              runAsNonRoot: false
              # runAsUser: 0
              runAsGroup: 1024
              runAsUser: 1024
              seccompProfile:
                type: RuntimeDefault

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          gateway:
            port: *apiPort
          dashboard:
            port: *dashboardPort
          webui:
            port: *webuiPort

    route:
      app:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: traefik-gateway
            namespace: ingress
            sectionName: websecure
        hostnames:
          - ${SUBDOMAIN}.${DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: hermes
                port: *webuiPort
          # - matches:
          #     - path:
          #         type: PathPrefix
          #         value: /dashboard
          #   backendRefs:
          #     - name: hermes
          #       port: *dashboardPort
          #   filters:
          #     - type: URLRewrite
          #       urlRewrite:
          #         path:
          #           type: ReplacePrefixMatch
          #           replacePrefixMatch: /

          - matches:
              - path:
                  type: PathPrefix
                  value: /gateway
            backendRefs:
              - name: hermes
                port: *apiPort
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /

    persistence:
      agent-source:
        type: emptyDir
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /agent-src
            install-tools:
              - path: /opt/hermes
            app:
              - path: /opt/hermes
            webui:
              - path: /home/hermeswebui/.hermes/hermes-agent
      data:
        forceRename: hermes-data
        labels:
          homelab/backup-resource: "true"
        storageClass: ${fastdata_storage}-ha
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /opt/data
            init:
              - path: /opt/data
            install-tools:
              - path: /opt/data
            app:
              - path: /opt/data
            webui:
              - path: /home/hermeswebui/.hermes
      webui-data:
        # forceRename: hermes-webui
        type: emptyDir
        # storageClass: ${fastdata_storage}-ha
        # type: persistentVolumeClaim
        # accessMode: ReadWriteOnce
        # size: 2Gi
        advancedMounts:
          hermes:
            webui:
              - path: /app # Execution directory, where webui source is copied to on startup

      config:
        type: configMap
        name: &configmap hermes-configmap
        defaultMode: 0o755
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
            # webui:
            #   - path: /app # Execution directory, where webui source is copied to on startup
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp

    configMaps:
      config:
        forceRename: *configmap
        data:
          config.yaml: |-
            custom_providers:
            - name: litellm
              base_url: http://litellm.ai.svc.cluster.local:4000/v1
              key_env: LITELLM_API_KEY
              models:
                openai/qwen36_27B:
                  context_length: 65535
            model:
              default: openai/qwen36_27B
              provider: custom:litellm
              context_length: 65535
            model_aliases:
              qwen:
                model: openai/qwen36_27B
                provider: custom:litellm
            memory:
              provider: memini
            plugins:
              enabled:
                - memini
            terminal:
              backend: local
              cwd: /opt/data/workspace
              timeout: 900
              lifetime_seconds: 1800
              persistent_shell: true
            approvals:
              mode: smart
              timeout: 60
              cron_mode: deny
            mcp_servers:
              homelab:
                url: http://litellm.ai:4000/mcp
                headers:
                  Authorization: "Bearer $${LITELLM_API_KEY}"
