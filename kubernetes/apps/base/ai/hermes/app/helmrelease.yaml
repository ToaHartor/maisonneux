---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  releaseName: *app
  dependsOn:
    - name: ${APP}-oidc
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 50m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
    strategy:
      name: RetryOnFailure # retry failed upgrades instead of rollback
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      # terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1024
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1024
        # runAsNonRoot: true
        runAsUser: 1024
        seccompProfile:
          type: RuntimeDefault

    controllers:
      # Example in docker compose : https://github.com/nesquena/hermes-webui/blob/master/docker-compose.two-container.yml
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          copy-agent-source:
            image: &hermesImage
              repository: docker.io/nousresearch/hermes-agent
              # v0.22.x stream: ships the prebuilt
              # Webapp, new providers: config schema, s6 profile reconciler and the
              # /etc/hermes machine-level config path. We keep our 1024
              # convention via the root + HERMES_UID remap (see app container below).
              tag: v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # hermes-agent >= v2026.7.x ships root-only playwright .deps files;
                # tolerate those but still fail on any other copy error.
                cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
                test -e /agent-src/.venv
                # Run config migration before s6 start
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024
              runAsUser: 1024
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data/workspace
                # Copy static config to Hermes folder
                cp /run/config/config.yaml /opt/data/config.yaml

                cp /run/config/AGENTS.md /opt/data/workspace/AGENTS.md
                chown 1024:1024 /opt/data/workspace/AGENTS.md

                # Upsert the managed .env keys into the profiles' .env files.
                # The keys live in the hermes-dotenv secret (owned by the
                # hermes-dotenv ExternalSecret, sourced from the litellm
                # master key; see externalsecret.yaml) and are mounted read-only
                # at /run/dotenv. The gateway multiplexes profiles (default +
                # operator) in one process, and in that mode hermes resolves
                # $${VAR} references in config.yaml (mcp_servers headers,
                # providers key_env) from the profile's .env secret scope
                # instead of the container environment — without LITELLM_API_KEY
                # there the profile sends the literal "Bearer $${LITELLM_API_KEY}"
                # and litellm answers 401, parking the MCP server. The upsert
                # replaces a managed key's line or appends it; user-managed
                # .env lines survive. Profile directories are never created here
                # (a deleted profile must not be resurrected by its .env).
                for dotkey in /run/dotenv/*; do
                  [ -f "$dotkey" ] || continue
                  key=$(basename "$dotkey")
                  val=$(cat "$dotkey")
                  [ -n "$val" ] || continue
                  for envfile in /opt/data/.env /opt/data/profiles/operator/.env; do
                    [ -d "$(dirname "$envfile")" ] || continue
                    tmp="$envfile.new"
                    if [ -e "$envfile" ]; then
                      grep -v "^$key=" "$envfile" > "$tmp" || true
                    else
                      : > "$tmp"
                    fi
                    printf '%s=%s\n' "$key" "$val" >> "$tmp"
                    chmod 600 "$tmp"
                    mv "$tmp" "$envfile"
                  done
                done

                # https://github.com/LukeEvansTech/talos-cluster/blob/fa46c31b2363b272019510be81fea9c883036760/kubernetes/apps/ai/hermes/app/helmrelease.yaml#L36
                # Install the memini memory-provider plugin from the upstream
                # standalone mirror eleboucher/memini-hermes (a release-synced
                # copy of integrations/hermes/plugin/memini). Pinned to a
                # commit, guarded by a .ref marker so normal restarts stay
                # offline and it only refetches when the pin changes. The mirror
                # is untagged, so bump this SHA by hand (verify the new commit
                # and diff the two files before bumping).

                # renovate gitref: depName=https://github.com/eleboucher/memini-hermes gitRef=main
                MEMINI_PLUGIN_REF=d0b6c8405176fc01db3f48850e2ab7de0258216e
                PLUGIN_DIR=/opt/data/plugins/memini
                if [ "$(cat "$PLUGIN_DIR/.ref" 2>/dev/null)" != "$MEMINI_PLUGIN_REF" ]; then
                  BASE="https://raw.githubusercontent.com/eleboucher/memini-hermes/$MEMINI_PLUGIN_REF"
                  if wget -qO /tmp/memini-init.py "$BASE/__init__.py" && wget -qO /tmp/memini-plugin.yaml "$BASE/plugin.yaml"; then
                    rm -rf "$PLUGIN_DIR"
                    mkdir -p "$PLUGIN_DIR"
                    mv /tmp/memini-init.py "$PLUGIN_DIR/__init__.py"
                    mv /tmp/memini-plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                    printf '%s' "$MEMINI_PLUGIN_REF" > "$PLUGIN_DIR/.ref"
                    chown -R 1024:1024 "$PLUGIN_DIR"
                  else
                    echo "WARN: memini plugin fetch failed; starting with whatever is present"
                  fi
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024
              runAsUser: 1024

          install-tools:
            image: *hermesImage
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # mkdir -p /opt/data/.local/bin /opt/data/.local/go

                # rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                # if [ ! -f /opt/data/.local/bin/gh ]; then
                #   cd /tmp
                #   curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                #   tar xzf gh.tar.gz
                #   cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                #   rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                # fi

                # if [ ! -f /opt/data/.local/go/bin/go ]; then
                #   cd /tmp
                #   curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                #   tar xzf go.tar.gz
                #   mv go /opt/data/.local/
                #   rm -rf go.tar.gz
                # fi

                # if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                #   export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                #   mkdir -p $HOMEBREW_PREFIX
                #   git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                # fi
                echo "Installation complete"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024

        containers:
          app:
            image: *hermesImage
            args:
              - gateway
              - run
              # - --no-supervise
            env:
              # Some settings can be overriden by env variables :
              # https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example
              # https://github.com/nousresearch/hermes-agent/blob/main/website/docs/reference/environment-variables.md
              TZ: Europe/Paris
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              HERMES_HOME: /opt/data
              HERMES_CRON_TIMEOUT: 0
              # The hermes-agent entrypoint refuses an arbitrary non-hermes UID:
              # the container starts as root and passes HERMES_UID/GID; the image
              # remaps its hermes user to 1024:1024 at boot and chowns the data
              # volume so files land owned by our uid/gid (== the --user outcome,
              # without breaking the s6 supervision tree).
              HERMES_UID: 1024
              HERMES_GID: 1024
              HOME: /opt/data
              GIT_CONFIG_GLOBAL: /opt/data/shared/gitconfig
              PATH: /opt/data/shared/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/mise:/opt/hermes/.venv/bin:/opt/hermes/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # Terminal HOME moves into each named profile; mise stays on the shared PVC.
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              # The profile HOME changes in terminal sessions; use one shared
              # mise config and tool installation for every profile.
              MISE_CONFIG_FILE: /opt/data/shared/mise.toml
              # API server
              # API_SERVER_ENABLED: true
              # API_SERVER_HOST: 0.0.0.0
              # API_SERVER_KEY:
              #   secretKeyRef:
              #     name: ${SECRET_KEY_NAME}
              #     key: secretKey
              # API_SERVER_CORS_ORIGINS: "*"
              # Dashboard
              HERMES_DASHBOARD_SESSION_TOKEN:
                secretKeyRef:
                  name: ${SECRET2_KEY_NAME}
                  key: secretKey
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://${DASHBOARD_SUBDOMAIN}.${DOMAIN_WEBSECURE}
              # OIDC
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientID
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientSecret
              # offline_access: makes authentik issue a refresh token (the hermes-dashboard
              # provider links the offline_access scope mapping, see dashboard-oidc.yaml);
              # the dashboard rotates it automatically, so the session lasts ~30 days
              # instead of the 5-minute access token TTL.
              HERMES_DASHBOARD_OIDC_SCOPES: openid profile email offline_access
              HERMES_DASHBOARD_OIDC_ISSUER:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: issuerURL
              # Additional services
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: shared/hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-api-key
                    key: secretKey
              FIRECRAWL_API_URL: http://firecrawl-api.services.svc.cluster.local:3002/v2/scrape
              FIRECRAWL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: firecrawl-api-key
                    key: secretKey
            envFrom:
              # .env API keys (hermes-dotenv, owned by the hermes-dotenv
              # ExternalSecret — externalsecret.yaml). Currently LITELLM_API_KEY;
              # every key added to that ExternalSecret lands in the container
              # environment too. The init container upserts the same keys into
              # the profiles' .env files for config-level $${VAR} resolution.
              - secretRef:
                  name: hermes-dotenv
            ports:
              # - containerPort: &apiPort 8642
              #   name: api
              #   protocol: TCP
              - containerPort: *dashboardPort
                name: dashboard
                protocol: TCP
              - containerPort: &webuiPort 9120
                name: webui
                protocol: TCP
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              # startup:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet: &httpGet
              #       path: /api/status
              #       port: *dashboardPort
              #     initialDelaySeconds: 10
              #     periodSeconds: 5
              #     timeoutSeconds: 5
              #     failureThreshold: 30
              # liveness:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet: *httpGet
              #     periodSeconds: 30
              #     timeoutSeconds: 5
              # readiness:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet: *httpGet
              #     timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              # allowPrivilegeEscalation: false
              # readOnlyRootFilesystem: true
              # capabilities:
              #   drop:
              #     - ALL
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
    service:
      app:
        controller: *app
        ports:
          # gateway:
          #   port: *apiPort
          dashboard:
            port: *dashboardPort
          webui:
            port: *webuiPort # webapp listener (off by default); re-add when webapp is enabled and the hermes host is routed back to it

    route:
      webui:
        parentRefs:
          - kind: Gateway
            name: traefik-gateway
            namespace: ingress
            sectionName: websecure
        hostnames:
          - ${SUBDOMAIN}.${DOMAIN}
        rules:
          # OpenAI-compatible agent API: the API server (8642) serves /v1/... at the
          # root (no API_SERVER_PREFIX knob), so /v1 maps straight through. The
          # dashboard has no /v1 routes, so this shadows nothing. Auth is Bearer
          # API_SERVER_KEY on the server itself.
          # - matches:
          #     - path:
          #         type: PathPrefix
          #         value: /v1
          #   backendRefs:
          #     - name: hermes
          #       port: *apiPort
          # Everything else -> the dashboard listener (9119): SPA, /api/*, /auth/*.
          # Deliberately the dashboard port, not the webapp port (9120): the webapp
          # listener's empty public_url short-circuits HERMES_DASHBOARD_PUBLIC_URL, so
          # a request on that listener reconstructs the OAuth redirect_uri from the
          # request Host — unregistered in authentik for this host.
          - backendRefs:
              - identifier: app
                port: webui
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: chain-local
      dashboard:
        parentRefs:
          - kind: Gateway
            name: traefik-gateway
            namespace: ingress
            sectionName: websecure
        hostnames:
          - ${DASHBOARD_SUBDOMAIN}.${DOMAIN}
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: chain-local

    persistence:
      agent-source:
        type: emptyDir
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /agent-src
            install-tools:
              - path: /opt/hermes
            app:
              - path: /opt/hermes
            # webui:
            #   - path: /home/hermeswebui/.hermes/hermes-agent
      data:
        forceRename: hermes-data
        labels:
          homelab/backup-resource: "true"
        storageClass: ${fastdata_storage}-ha
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /opt/data
            init:
              - path: /opt/data
            install-tools:
              - path: /opt/data
            app:
              - path: /opt/data
            # webui:
            #   - path: /home/hermeswebui/.hermes

      config:
        type: configMap
        name: &configmap hermes-configmap
        defaultMode: 0o755
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/AGENTS.md
                subPath: AGENTS.md
      dotenv:
        # Managed .env keys, owned by the hermes-dotenv ExternalSecret
        # (externalsecret.yaml). Mounted into the init container only;
        # it upserts the keys into the profiles' .env files on every
        # pod start. 0o444: the init container runs as uid 1024 (no
        # fsGroup), so the files must be world-readable.
        type: secret
        name: hermes-dotenv
        defaultMode: 0o444
        advancedMounts:
          hermes:
            init:
              - path: /run/dotenv
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
            # webui:
            #   - path: /app # Execution directory, where webui source is copied to on startup
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
      # Tools as image
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.2
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true

    configMaps:
      config:
        forceRename: *configmap
        data:
          AGENTS.md: |-
            # AGENTS.md — Hermes

            ## 0 · Identity
            You are Hermes, a general-purpose agent.
            Rules in this file apply to every session.
            Do not re-derive the plan from compressed context — if a long task is ongoing,
            progress lives in `04 - Agents/hermes/notes/`.

            ## 1 · This file (and its siblings) are IMMUTABLE — managed by Git in Kubernetes
            - `/opt/data/workspace/AGENTS.md` (and siblings `/opt/data/config.yaml`, `/opt/data/.env`)
              are read-only to me. I do NOT create, edit, append to, or delete them.
            - They are not written at runtime. They are deployed from a Git repo into
              Kubernetes; I only ever see a new version after: Git commit → K8s resync
              (ConfigMap file propagation, or pod restart if mounted as env vars).
            - Consequence: even if the container filesystem happens to be writable, I do
              NOT write these files. A local edit is lost on the next rollout and diverges
              from Git, which is the single source of truth.
            - If I believe a rule in this file is wrong, stale, or missing, I do NOT change
              the file. Instead:
              1. record a `procedural` memini fact —
                "AGENTS.md §<n>: rule should be <X> because <why> (proposed change)"
              2. add a one-liner to the daily log (§6 ③)
              3. tell the human
            - The human applies the change in the config repo; it reaches me on the next
              resync. Until then I follow this file exactly as written.

            ## 2 · The knowledge model (3 layers)
            - **Content (shared):** the Obsidian vault — plain markdown, synced via obsidian-sync.
            - **Retrieval (per-agent):** obsidian-sync-mcp (keyword/file search) + memini recall.
              Semantic RAG is OFF; only enable it if structured + keyword search demonstrably fail.
            - **Lifecycle (shared, durable):** memini — 4 tiers (working → episodic → semantic →
              procedural), TTL + decay, namespaces with automatic durable-only ancestor cascade.

            ## 3 · Vault access (via obsidian-sync-mcp)
            Vault root = `$OBSIDIAN_VAULT` (currently `~/vault`). All paths are relative to it.
            Tools: `obsidian_search(keyword)` and `obsidian_read_file(path)`.

            HUMAN-OWNED — READ ONLY, NEVER write:
              00 - Inbox/ · 02 - Notes/ · 03 - Areas/ · 98 - System/

            SHARED READ:
              01 - Knowledge/ · 05 - Work/ · 06 - Projects/ · 04 - Agents/

            AGENT-WRITABLE — the only paths I write to:
              04 - Agents/{incidents,decisions,specs,runbooks}/YYYY-MM/*.md
              04 - Agents/hermes/{daily,notes}/
              04 - Agents/INCIDENTS.md · DECISIONS.md · CONVENTIONS.md  (append-only, 1 line)
              06 - Projects/<name>/_agent-references.md  (append-only, 1 line)

            DO NOT WRITE:
              00, 02, 03, 98 (human folders)
              04 - Agents/pi/ (Pi's private folder)
              04 - Agents/_meta/ (shared schema, conflict-policy, changelog — Pi owns)
              anything else in 06 - Projects/ (only the _agent-references.md append line)

            ## 4 · Search priority (cheapest first — stop at the first hit)
            1. `memory_recall` — "did we ever record X / what's the standing rule?"
              (structured, cross-agent, cross-session; the only way to reach Pi's facts)
            2. `obsidian_search(keyword)` — literal mentions anywhere in the vault
            3. Read the index files by path — `obsidian_read_file("04 - Agents/INCIDENTS.md")`,
              `DECISIONS.md`, `CONVENTIONS.md`, `06 - Projects/<name>/_agent-references.md`
              (by-title / recent / per-project; I can't grep frontmatter, so structured
              lookups go through index files + note frontmatter, not keyword search)
            4. `obsidian_read_file` on a specific note once located
            5. Semantic RAG — **off by default**; only when 1-4 demonstrably fail

            ## 5 · memini (durable memory)
            - My namespace: `shared/hermes` (set via `MEMINI_NAMESPACE=shared/hermes` in `.env` —
              full-path override, because I connect over stdio MCP with no handshake).
            - Namespaces are IMPLICIT: they "exist" on first write. There are no create/link
              commands. Verify setup with `memini doctor`.
            - Sharing: the `shared` ancestor. Durable facts I mark `visibility: "shared"` route
              up to `shared` and become readable by Pi (and any other agent under `shared`)
              via the automatic durable-only cascade (semantic + procedural tiers only).
            - `working` / `episodic` tiers are clamped to `shared/hermes` — they never reach
              `shared`. Never store a shared fact in a private tier.

            ## 6 · Write workflow — one event, two artifacts (identical to Pi)
            When an incident or decision happens:

            ① memini fact — IMMEDIATE, before anything else.
              1-3 lines, atomic. `memory_remember(...)`:
              durable + needed by other agents → tier `semantic`/`procedural`,
              `visibility: "shared"`
              session-level → `working`/`episodic`, no visibility

            ② Vault note — AT RESOLUTION.
              Create `04 - Agents/incidents/YYYY-MM/<slug>.md` (or `decisions/`) from the
              template in `98 - System/Templates/agent-incident.md` (or `agent-decision.md`).
              Rich narrative: timeline, root cause, follow-ups.
              Frontmatter MUST include `memini_fact:` = the exact text from ① (the bridge),
              plus `type, date, project (if applicable), service, status, severity, tags`.

            ③ Daily log — APPEND one bullet.
              `04 - Agents/hermes/daily/YYYY-MM-DD.md`

            ④ Index — APPEND one line to `04 - Agents/INCIDENTS.md` or `DECISIONS.md`.
              ④b. If ② set `project:`, also append one line to
              `06 - Projects/<name>/_agent-references.md`
              (wiki-link to the note + one-line summary). Nothing else in that folder.

            ⑤ Runbook — only if a new convention emerged.
              Create/update `04 - Agents/runbooks/<topic>.md` + append to `CONVENTIONS.md`.

            Invariants:
            - ① always before ② — an interrupted session must still leave the durable fact.
            - ①② are knowledge; ③④ are pointers. An index line without its note is useless.

            ## 7 · Plan-first (non-trivial work)
            Before code on any substantial change: brainstorm → write the plan → implement → verify.
            At plan clearance, log it as ①-④ with `type: decision`.
            The plan document goes in `04 - Agents/specs/<feature>/` if it needs a home.
            No code before the plan is agreed.

            ## 8 · Loop prevention (behavioral — the only loop protection I have)
            - Before retrying a failed approach, state in one line WHY it failed and what is
              DIFFERENT. If I can't, stop and report the blocker instead of retrying.
            - 3 failed attempts on the same problem = stop, summarize what I tried and learned,
              and ask. Never silently attempt a 4th variation.
            - Verify before acting: "file/config doesn't exist" → confirm with one read first.
            - Long multi-step work: keep progress in `04 - Agents/hermes/notes/`,
              not in re-derived context.

            ## 9 · Prohibitions
            - Never write to the DO-NOT-WRITE paths in §3.
            - Never create new subfolders outside `04 - Agents/hermes/{daily,notes}/`.
              Project linkage is the `project:` frontmatter + the index line, not a new folder.
            - Index files (`INCIDENTS.md`, `DECISIONS.md`, `CONVENTIONS.md`) are APPEND-ONLY —
              never edit or rewrite past entries.
            - Never store secrets/credentials in the vault (it's synced).
              Secrets stay in `.env` / key files.
            - Don't dump large logs or transcripts into memini — facts are 1-3 lines;
              narratives go to the vault.
            - Don't use `working`/`episodic` tiers as a shared store.
            - On an obsidian-sync conflict: follow `04 - Agents/_meta/conflict-policy.md`,
              then record the merge in `04 - Agents/_meta/changelog.md`.
              Never silently discard a side.

            ## 10 · Runtime events worth logging
            If a command was held/blocked, a plan was rejected, or I repeated a mistake
            across sessions: append a one-liner to the daily log (§6 ③).
            If it's a repeated pattern: promote to a memini fact (`procedural`,
            `visibility: "shared"` when relevant to Pi) + a vault note + a runbook candidate.
