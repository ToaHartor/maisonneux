---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  releaseName: *app
  dependsOn:
    - name: ${APP}-oidc
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 50m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
    strategy:
      name: RetryOnFailure # retry failed upgrades instead of rollback
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      # terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1024
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1024
        # runAsNonRoot: true
        runAsUser: 1024
        seccompProfile:
          type: RuntimeDefault

    controllers:
      # Example in docker compose : https://github.com/nesquena/hermes-webui/blob/master/docker-compose.two-container.yml
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          copy-agent-source:
            image: &hermesImage
              repository: docker.io/nousresearch/hermes-agent
              # v0.22.x stream: ships the prebuilt
              # Webapp, new providers: config schema, s6 profile reconciler and the
              # /etc/hermes machine-level config path. We keep our 1024
              # convention via the root + HERMES_UID remap (see app container below).
              tag: v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # hermes-agent >= v2026.7.x ships root-only playwright .deps files;
                # tolerate those but still fail on any other copy error.
                cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
                test -e /agent-src/.venv
                # Run config migration before s6 start
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024
              runAsUser: 1024
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data/workspace
                # Copy static config to Hermes folder
                cp /run/config/config.yaml /opt/data/config.yaml

                cp /run/config/AGENTS.md /opt/data/workspace/AGENTS.md
                chown 1024:1024 /opt/data/workspace/AGENTS.md

                # The managed .env upsert (upsert.py) and the per-profile
                # fragment merge (apply-profiles.py via the mise-installed
                # yq shim) run in the install-tools init container instead: the alpine image
                # runs as uid 1024, so it cannot apk-install python. See
                # the install-tools command below for the full rationale.

                # https://github.com/LukeEvansTech/talos-cluster/blob/fa46c31b2363b272019510be81fea9c883036760/kubernetes/apps/ai/hermes/app/helmrelease.yaml#L36
                # Install the memini memory-provider plugin from the upstream
                # standalone mirror eleboucher/memini-hermes (a release-synced
                # copy of integrations/hermes/plugin/memini). Pinned to a
                # commit, guarded by a .ref marker so normal restarts stay
                # offline and it only refetches when the pin changes. The mirror
                # is untagged, so bump this SHA by hand (verify the new commit
                # and diff the two files before bumping).

                # renovate gitref: depName=https://github.com/eleboucher/memini-hermes gitRef=main
                MEMINI_PLUGIN_REF=d0b6c8405176fc01db3f48850e2ab7de0258216e
                PLUGIN_DIR=/opt/data/plugins/memini
                if [ "$(cat "$PLUGIN_DIR/.ref" 2>/dev/null)" != "$MEMINI_PLUGIN_REF" ]; then
                  BASE="https://raw.githubusercontent.com/eleboucher/memini-hermes/$MEMINI_PLUGIN_REF"
                  if wget -qO /tmp/memini-init.py "$BASE/__init__.py" && wget -qO /tmp/memini-plugin.yaml "$BASE/plugin.yaml"; then
                    rm -rf "$PLUGIN_DIR"
                    mkdir -p "$PLUGIN_DIR"
                    mv /tmp/memini-init.py "$PLUGIN_DIR/__init__.py"
                    mv /tmp/memini-plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                    printf '%s' "$MEMINI_PLUGIN_REF" > "$PLUGIN_DIR/.ref"
                    chown -R 1024:1024 "$PLUGIN_DIR"
                  else
                    echo "WARN: memini plugin fetch failed; starting with whatever is present"
                  fi
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1024
              runAsUser: 1024

          install-tools:
            image: *hermesImage
            env:
              # Same mise layout as the app container, so tools installed
              # at boot land in the shared PVC (persistent, and on the
              # agent's PATH via the shims directory) instead of the
              # container's ephemeral filesystem.
              - name: MISE_CACHE_DIR
                value: /opt/data/.cache/mise
              - name: MISE_CONFIG_DIR
                value: /opt/data/.config/mise
              - name: MISE_DATA_DIR
                value: /opt/data/.local/share/mise
              - name: MISE_STATE_DIR
                value: /opt/data/.local/state/mise
              # Shared sigstore/cosign TUF trust-root cache on the PVC
              # ($HOME is not writable by uid 1024; see the install-tools
              # mise install step for the full rationale).
              - name: XDG_CACHE_HOME
                value: /opt/data/.cache
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # mkdir -p /opt/data/.local/bin /opt/data/.local/go

                # rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                # if [ ! -f /opt/data/.local/bin/gh ]; then
                #   cd /tmp
                #   curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                #   tar xzf gh.tar.gz
                #   cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                #   rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                # fi

                # if [ ! -f /opt/data/.local/go/bin/go ]; then
                #   cd /tmp
                #   curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                #   tar xzf go.tar.gz
                #   mv go /opt/data/.local/
                #   rm -rf go.tar.gz
                # fi

                # if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                #   export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                #   mkdir -p $HOMEBREW_PREFIX
                #   git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                # fi

                # Boot-time tool install via mise. The jdx/mise image
                # mount (/opt/mise) provides the mise binary; the tool
                # pins live in the hermes-profile-config ConfigMap
                # (mise.toml, mounted at /run/profile-config). Tools
                # land in the shared PVC (MISE_DATA_DIR) with shims in
                # /opt/data/.local/share/mise/shims — already on the
                # agent's PATH, so the agents pick these tools up for
                # free too. First boot downloads from GitHub; later
                # boots are offline (PVC-cached, and mise skips tools
                # whose installed version already matches the pin).
                # Bump a tool = edit the CM's mise.toml key, no HR edit.
                # Non-fatal by design: a failed download only skips the
                # profile-fragment merge this boot (apply-profiles.py
                # detects the missing yq shim and logs a WARN), and the
                # next boot retries.
                #
                # XDG_CACHE_HOME pins the sigstore TUF trust-root cache
                # (created during cosign release-signature verification)
                # to the shared PVC: the hermes image's $HOME is not
                # writable by uid 1024, so the default
                # $HOME/.cache/sigstore-rust path would fail with
                # "Permission denied"; persisting it on the PVC also
                # makes later boots' verification cheaper. No `$` in
                # this whole block: env-var *prefix* assignments only.
                mkdir -p /opt/data/.cache
                if ! XDG_CACHE_HOME=/opt/data/.cache MISE_CONFIG_FILE=/run/profile-config/mise.toml /opt/mise/mise install; then
                  echo "WARN: mise install failed; profile-fragment merge will be skipped this boot"
                fi

                # Managed .env upsert. The alpine init container cannot run
                # this (uid 1024: no apk, no python), so it runs here on the
                # hermes image, whose .venv ships python.
                #
                # Upserts the managed .env keys into the launch-scope .env
                # file and every existing profile's .env.
                # The keys live in the hermes-dotenv secret (owned by the
                # hermes-dotenv ExternalSecret, sourced from the litellm
                # master key; see externalsecret.yaml) and are mounted read-only
                # at /run/dotenv, one file per key (filename = key, content =
                # value). The gateway multiplexes all profiles in one
                # process, and hermes resolves variable references in
                # config.yaml (mcp_servers headers, providers key_env) from
                # the profile's .env secret scope instead of the container
                # environment — without LITELLM_API_KEY there the profile
                # sends the literal Bearer placeholder and litellm answers
                # 401, parking the MCP server. The upsert replaces a
                # managed key's line or appends it; user-managed .env lines
                # survive. The target list is the launch-scope /opt/data/.env
                # plus the .env of every existing profile directory, so new
                # profiles pick the keys up automatically on the next start.
                # Profile directories are never created here (a deleted
                # profile must not be resurrected by its .env).
                # Rationale + logic live in the upsert.py header
                # (hermes-profile-config ConfigMap, mounted at
                # /run/profile-config).
                /opt/hermes/.venv/bin/python /run/profile-config/upsert.py

                # Merge the Git-managed per-profile fragments
                # (hermes-profile-config ConfigMap, mounted at
                # /run/profile-config: one <name>.yaml fragment per
                # profile, merged by the mise-installed yq shim — see
                # the mise install step above — driven by
                # apply-profiles.py)
                # into each profile's config.yaml. Hermes has no
                # native profile config inheritance and the /etc/hermes
                # machine overlay is shared by every profile, so
                # per-profile values (toolset trims, approvals policy)
                # are managed here instead. Deep merge, fragment wins
                # per leaf (lists replaced, not concatenated); yq's
                # round-trip emitter keeps the user's comments/quotes
                # and untouched scalars (YAML 1.1 booleans survive
                # verbatim). The merge result is re-parsed before the
                # atomic write — hermes reads every profile's
                # config.yaml, and a parse failure would poison the
                # next image bump.
                # Only the config.yaml file is touched: profile
                # directories are never created or removed here —
                # profile create/clone and parking stay deliberate
                # hermes profile CLI / dashboard operations, and a
                # fragment whose profile directory does not exist yet
                # is skipped with a warning.
                /opt/hermes/.venv/bin/python /run/profile-config/apply-profiles.py

                # Converge ownership on the data volume. The hermes
                # image's s6 root layer (stage2 hook, terminal
                # service slots) and the 10000-era hermes user can
                # both leave files under /opt/data owned by a uid
                # other than the 1024 convention (e.g.
                # profiles/main/.env, state.db, the mise shims
                # directory) that the uid-1024 supervised gateway
                # (s6-setuidgid + HERMES_UID drop) cannot read or
                # write. The stage2 volume chown only fixes the
                # top-level directory when its owner differs, so
                # non-1024 files inside profiles/ are never
                # corrected by the image — this step is. Running as
                # root (container-level override, see
                # securityContext below) it can chown anything back.
                # Metadata-only walk, idempotent: a fully-1024
                # volume is a no-op. Runs LAST so it also converges
                # the files the upsert/merge steps above just wrote
                # as root.
                if ! find /opt/data ! -user 1024 -exec chown 1024:1024 {} +; then
                  echo "WARN: ownership convergence failed"
                fi

                echo "Installation complete"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # Container-level override of the pod-level runAsUser 1024:
              # the hermes image's s6 root layer leaves files on the
              # shared data PVC owned by uids other than 1024 (root,
              # or the 10000 build user); only root can chown them
              # back (final find-chown step in the command). The app
              # container already runs as root by image design, so no
              # new exposure class; this is a short-lived init.
              runAsUser: 0
              runAsGroup: 1024

        containers:
          app:
            image: *hermesImage
            args:
              - gateway
              - run
              # - --no-supervise
            env:
              # Some settings can be overriden by env variables :
              # https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example
              # https://github.com/nousresearch/hermes-agent/blob/main/website/docs/reference/environment-variables.md
              TZ: Europe/Paris
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              HERMES_HOME: /opt/data
              HERMES_CRON_TIMEOUT: 0
              # The hermes-agent entrypoint refuses an arbitrary non-hermes UID:
              # the container starts as root and passes HERMES_UID/GID; the image
              # remaps its hermes user to 1024:1024 at boot and chowns the data
              # volume so files land owned by our uid/gid (== the --user outcome,
              # without breaking the s6 supervision tree).
              HERMES_UID: 1024
              HERMES_GID: 1024
              HOME: /opt/data
              GIT_CONFIG_GLOBAL: /opt/data/shared/gitconfig
              PATH: /opt/data/shared/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/mise:/opt/hermes/.venv/bin:/opt/hermes/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # Terminal HOME moves into each named profile; mise stays on the shared PVC.
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              # Shared sigstore/cosign TUF trust-root cache on the PVC
              # (see the install-tools comment; $HOME is unwritable by
              # uid 1024, so the default $HOME/.cache path fails).
              XDG_CACHE_HOME: /opt/data/.cache
              # The profile HOME changes in terminal sessions; use one shared
              # mise config and tool installation for every profile.
              MISE_CONFIG_FILE: /opt/data/shared/mise.toml
              # API server
              # API_SERVER_ENABLED: true
              # API_SERVER_HOST: 0.0.0.0
              # API_SERVER_KEY:
              #   secretKeyRef:
              #     name: ${SECRET_KEY_NAME}
              #     key: secretKey
              # API_SERVER_CORS_ORIGINS: "*"
              # Dashboard
              HERMES_DASHBOARD_SESSION_TOKEN:
                secretKeyRef:
                  name: ${SECRET2_KEY_NAME}
                  key: secretKey
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://${DASHBOARD_SUBDOMAIN}.${DOMAIN_WEBSECURE}
              # OIDC
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientID
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: clientSecret
              # offline_access: makes authentik issue a refresh token (the hermes
              # provider links the offline_access scope mapping via the ks.yaml
              # patch on homelab/auth-component=true); the dashboard rotates it
              # automatically, so the session lasts ~30 days instead of the
              # 5-minute access token TTL.
              HERMES_DASHBOARD_OIDC_SCOPES: openid profile email offline_access
              HERMES_DASHBOARD_OIDC_ISSUER:
                secretKeyRef:
                  name: ${APP}-oidc-authentik-application
                  key: issuerURL
              # Additional services
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: shared/hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-api-key
                    key: secretKey
              FIRECRAWL_API_URL: http://firecrawl-api.services.svc.cluster.local:3002/v2/scrape
              FIRECRAWL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: firecrawl-api-key
                    key: secretKey
            envFrom:
              # .env API keys (hermes-dotenv, owned by the hermes-dotenv
              # ExternalSecret — externalsecret.yaml). Currently LITELLM_API_KEY;
              # every key added to that ExternalSecret lands in the container
              # environment too. The init container upserts the same keys into
              # the profiles' .env files for config-level $${VAR} resolution.
              - secretRef:
                  name: hermes-dotenv
            ports:
              # - containerPort: &apiPort 8642
              #   name: api
              #   protocol: TCP
              - containerPort: *dashboardPort
                name: dashboard
                protocol: TCP
              - containerPort: &webuiPort 9120
                name: webui
                protocol: TCP
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              # startup:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet: &httpGet
              #       path: /api/status
              #       port: *dashboardPort
              #     initialDelaySeconds: 10
              #     periodSeconds: 5
              #     timeoutSeconds: 5
              #     failureThreshold: 30
              # liveness:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet: *httpGet
              #     periodSeconds: 30
              #     timeoutSeconds: 5
              # readiness:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet: *httpGet
              #     timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              # allowPrivilegeEscalation: false
              # readOnlyRootFilesystem: true
              # capabilities:
              #   drop:
              #     - ALL
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
    service:
      app:
        controller: *app
        ports:
          # gateway:
          #   port: *apiPort
          dashboard:
            port: *dashboardPort
          webui:
            # webapp listener (off by default); re-add when webapp is enabled and the hermes host is routed back to it
            port: *webuiPort

    route:
      webui:
        parentRefs:
          - kind: Gateway
            name: traefik-gateway
            namespace: ingress
            sectionName: websecure
        hostnames:
          - ${SUBDOMAIN}.${DOMAIN}
        rules:
          # OpenAI-compatible agent API: the API server (8642) serves /v1/... at the
          # root (no API_SERVER_PREFIX knob), so /v1 maps straight through. The
          # dashboard has no /v1 routes, so this shadows nothing. Auth is Bearer
          # API_SERVER_KEY on the server itself.
          # - matches:
          #     - path:
          #         type: PathPrefix
          #         value: /v1
          #   backendRefs:
          #     - name: hermes
          #       port: *apiPort
          # Everything else -> the dashboard listener (9119): SPA, /api/*, /auth/*.
          # Deliberately the dashboard port, not the webapp port (9120): the webapp
          # listener's empty public_url short-circuits HERMES_DASHBOARD_PUBLIC_URL, so
          # a request on that listener reconstructs the OAuth redirect_uri from the
          # request Host — unregistered in authentik for this host.
          - backendRefs:
              - identifier: app
                port: webui
            # filters:
            #   - type: ExtensionRef
            #     extensionRef:
            #       group: traefik.io
            #       kind: Middleware
            #       name: chain-local
      dashboard:
        parentRefs:
          - kind: Gateway
            name: traefik-gateway
            namespace: ingress
            sectionName: websecure
        hostnames:
          - ${DASHBOARD_SUBDOMAIN}.${DOMAIN}
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: chain-local

    persistence:
      agent-source:
        type: emptyDir
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /agent-src
            install-tools:
              - path: /opt/hermes
            app:
              - path: /opt/hermes
            # webui:
            #   - path: /home/hermeswebui/.hermes/hermes-agent
      data:
        forceRename: hermes-data
        labels:
          homelab/backup-resource: "true"
        storageClass: ${fastdata_storage}-ha
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /opt/data
            init:
              - path: /opt/data
            install-tools:
              - path: /opt/data
            app:
              - path: /opt/data
            # webui:
            #   - path: /home/hermeswebui/.hermes

      config:
        type: configMap
        name: hermes-base-config
        defaultMode: 0o755
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/AGENTS.md
                subPath: AGENTS.md
      dotenv:
        # Managed .env keys, owned by the hermes-dotenv ExternalSecret
        # (externalsecret.yaml). Mounted into the install-tools init
        # container only; it upserts the keys into the profiles' .env
        # files on every pod start. 0o444: the container runs as uid
        # 1024, so the files must be world-readable.
        type: secret
        name: hermes-dotenv
        defaultMode: 0o444
        advancedMounts:
          hermes:
            install-tools:
              - path: /run/dotenv
      machine-config:
        # Machine-level managed config (hermes v0.22+ managed scope):
        # mounted read-only at /etc/hermes on the gateway container
        # only. The gateway deep-merges it on top of every profile's
        # config.yaml (per-leaf; managed values win), and ${VAR} refs
        # expand against the process env (LITELLM_API_KEY via the
        # hermes-dotenv envFrom), so users cannot shadow managed
        # values. A malformed file is logged loudly and fails open
        # (no policy applied, startup is never blocked).
        # subPath mount: the image bakes other files into /etc/hermes
        # (chromium-executable-path, read by hermes_cli/browser_runtime.py
        # to locate the staged chromium binary) — a whole-directory
        # mount would hide them and break the browser toolset's probe.
        type: configMap
        name: hermes-machine-config
        defaultMode: 0o444
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes/config.yaml
                subPath: config.yaml
      profile-config:
        # Per-profile config fragments (<name>.yaml, one per profile)
        # + the merge driver (apply-profiles.py, which uses the mise-
        # installed yq shim) for the profiles' config.yaml files,
        # + the boot-time tool pins (mise.toml, installed by the same
        # container via the jdx/mise image),
        # consumed by the install-tools init container. Hermes
        # has no native
        # profile config inheritance and the /etc/hermes overlay is
        # machine-wide, so profile-differentiating keys are managed
        # here. The apply-profiles driver skips fragments whose profile directory
        # does not exist yet (profile creation stays a deliberate
        # hermes profile CLI / dashboard operation).
        type: configMap
        name: hermes-profile-config
        defaultMode: 0o444
        advancedMounts:
          hermes:
            install-tools:
              - path: /run/profile-config
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
            # webui:
            #   - path: /app # Execution directory, where webui source is copied to on startup
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
      # Tools as image
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.2
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
            install-tools:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
