---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name firecrawl-api-key
spec:
  dataFrom:
    - extract:
        key: firecrawl-bull-key
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: services-secretstore
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
---
# .env keys for the hermes profiles. The multiplexed gateway resolves $${VAR}
# references in config.yaml (providers key_env, mcp_servers headers) from the
# profile's .env secret scope, not the container environment, so the litellm
# master key must land in the profiles' .env files: the init container
# upserts this secret's keys into /opt/data/.env (default profile) and
# /opt/data/profiles/operator/.env on every pod start. New key = new data
# entry; the init loop picks it up automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dotenv
spec:
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-master-key
        property: secretKey
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: ai-secretstore
  target:
    name: hermes-dotenv
    creationPolicy: Owner
    deletionPolicy: Retain
