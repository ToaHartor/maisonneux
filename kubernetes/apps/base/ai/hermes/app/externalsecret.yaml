---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name firecrawl-api-key
spec:
  dataFrom:
    - extract:
        key: firecrawl-bull-key
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: services-secretstore
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
---
# .env keys for the hermes profiles. The multiplexed gateway resolves $${VAR}
# references in config.yaml (providers key_env, mcp_servers headers) from the
# profile's .env secret scope, not the container environment, so these keys
# must land in the profiles' .env files: the install-tools init container
# upserts this secret's keys into /opt/data/.env (launch scope) and every
# existing profile's .env on every pod start. New key = new data entry; the
# init loop picks it up automatically.
#
# API_SERVER_KEY gates the multiplexed gateway's per-profile API servers
# (/v1/* at the root and /p/<profile>/v1/* per profile). The same value is
# upserted into every profile's .env, so one key serves all profiles — the
# inter-agent channel (decision note 2026-11-11 jarvis-operator-http-channel).
# The value lives in the ai-namespace k8s secret hermes-api-key; rotate it
# there and the next pod start converges the managed .env lines.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dotenv
spec:
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-master-key
        property: secretKey
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-api-key
        property: secretKey
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: ai-secretstore
  target:
    name: hermes-dotenv
    creationPolicy: Owner
    deletionPolicy: Retain
