# Qwen 3.8 27B NVFP4 (esatapedico MID-HIGH) + DSPARK block-diffusion drafter
# on beellama v0.4.7. CANDIDATE - commented out in kustomization.yaml.
#
# Mutually exclusive with qwen38-vllm.yaml (active primary), qwen38-bee-mtp.yaml,
# qwen38-dspark.yaml (vLLM DSpark, boot-failed) and qwen38-sglang.yaml (shelved):
# all define InferenceService qwen38; enable at most one. The target Model CR
# name qwen38-nvfp4-midhigh intentionally matches qwen38-bee-mtp.yaml's, so the
# two files must never be active together (kustomize duplicate-resource error).
#
# Why this exists (2026-09-28): vLLM reached its endgame (b12x GEMM + MTP k=4 +
# fp8 KV, pool 278,927; DSpark-on-vLLM boot-failed on footprint; SGLang DSpark
# shelved on OOM). DSpark looked engine-native to SGLang/vLLM only - but
# beellama v0.4.7 implements the DFlash/DSpark draft family itself:
#   - fork args doc: KVarN is "runtime-qualified on CUDA for draft-simple,
#     EAGLE3, the owned MTP allowlist, DFlash1/DFlash2, and non-MLA DSpark
#     contexts"; draft ubatch is "128 or larger for parallel DFlash/DSpark"
#     (max(128, parallel*(n_max+1)) for merged noise blocks = block-diffusion)
#   - CRD: speculativeDecoding.type: draft-dspark (typed, CEL-validated),
#     draftModelRef = a separate PVC-cached Model CR ("downloads and caches
#     the draft exactly like the target model") - no HF re-download on every
#     pod restart (the vLLM DSpark pain point)
#   - Anbeeld (beellama's author) publishes the drafter as GGUF:
#     Anbeeld/Qwen3.8-27B-DSpark-GGUF (Q2_K..Q8_0 + bf16 ladder)
#   - the drafter (RadixArk/Qwen3.8-27B-DSpark) was co-trained and evaluated
#     against NVFP4 targets (RadixArk/Qwen3.8-27B-NVFP4) - the MID-HIGH
#     NVFP4 target is the intended pairing. (Baseline is qwen38-bee-mtp.yaml,
#     the tuned beellama winner - NOT the legacy qwen38.yaml uncensored setup.)
#
# Drafter: 1.86B, five full-attention layers, VanillaMarkov head rank 256,
# target aux layers 5/19/33/47/61, block_size 7 / gamma 7 / verify width 8,
# 262,144 max position embeddings (no DFlash2-style 2048-token SWA window -
# the long-context collapse that killed DFlash2 is exactly what DSpark fixes).
# Published acceptance (SGLang GB300/H200, v2 - hardware does not transfer):
# aggregate 3.43 accepted/step (math 4.2-4.5, code 3.4-4.1, chat 3.2,
# RULER-8K 6.3, LongBench-v2 3.9) vs our MTP k=4 ~2.5-3.2 and MTP k=3 ~2.5.
#
# Numbers to beat (same box, zero concurrency):
#   - beellama MID-HIGH + MTP k=3: 68.1 t/s short, 53.7 t/s @59K (KV-bound),
#     prefill 1339 t/s, pos-1 acc 0.78 (qwen38-bee-mtp.yaml A/B)
#   - vLLM primary: ~72 t/s short, 59K cold 21s / warm 4.1s, structured 108 t/s
# Risks: 3.16x is GB300/H200 data; per-draft-step cost on 2x5060Ti TP2 is
# unknown; @59K we are KV-bandwidth-bound, so gains concentrate in decode.
# Draft Q4_K_M ~1.05 GB total (~0.52 GB/rank) - the DFlash2 Q3_K_M draft of
# the same size class booted fine on this box. If OOM: drop to Q3_K_M.
#
# TENSOR SPLIT CRASH (2026-09-28, first boot test): the pod booted fine
# (draft loaded, prefill completed) but aborted on the FIRST spec step with
#   ggml/src/ggml-backend-meta.cpp:621: GGML_ASSERT(ret.axis !=
#   GGML_BACKEND_SPLIT_AXIS_UNKNOWN) failed
# Known upstream bug class: the DFlash/DSpark draft graphs break the
# tensor-split meta layer on 2-GPU CUDA. Evidence: llama.cpp #27819
# (DFlash2 + tensor split, reproduced on exactly 2x RTX 5060 Ti 16 GB -
# "It is working with --split-mode layer"), #27964 (Qwen3.8-Flash-Next
# target-side tensor abort on 2x5090, open), #26339 (DSpark -sm tensor,
# closed not_planned). Community fix PR #27858 (DFlash2 tensor assert +
# VRAM footprint) is OPEN/unmerged; beellama v0.4.7 is still the newest
# stable. Draft-KV cache type is NOT the cause: f16/q8_0/q4_0/kvarn4/
# kvarn5 all crash identically. => this file now runs --split-mode layer
# (the documented workaround); perf cost = per-layer-boundary allreduce on
# PCIe vs tensor's split GEMMs - acceptable for a fallback-engine A/B.
# Revisit trigger: #27858 merges + beellama ships it -> flip back to
# --split-mode tensor + --tensor-split 1,1 and re-test.
#
# LAYER-MODE A/B RESULTS 2026-09-28 (2nd attempt, pod qwen38-596f5b69c8-6x5w6):
# BOOT + FIRST SPEC STEP OK (the tensor-split assert is gone), but the numbers
# are a loss across the board (scripts/llm_bench.py --port-forward):
#   short prose    34.1 t/s (MTP-bee 68.1, vLLM b12x ~72) - LAYER split costs
#                  ~2x decode: per-layer allreduce over PCIe (no P2P on 5060 Ti)
#   structured     45.0-45.1 t/s x3 (no recorded MTP-bee number for this
#                  prompt; vLLM b12x on it: 108 t/s) - halved by layer split
#   long COLD 68.5K 82.51s (MTP-bee 21s) / WARM 4.80s (MTP-bee 4.1s, vLLM 4.1s)
#   draft acceptance: mean len ~2.4 (rate 0.63/0.46/0.35) - BELOW the published
#                  H200 3.43 and below our MTP k=4 vLLM (2.64); the
#                  Q4_K_M draft on 5060 Ti underperforms the co-training eval
#   quality: math 70336 PASS + get_weather tool PASS
#   WARN in logs: 'target output is split across devices; using CPU draft
#                  sampler' - the draft sampler runs on CPU under layer split
# VERDICT: DSpark-on-beellama LAYER mode LOSES to both MTP-beellama (2x decode
# penalty) and vLLM b12x (primary). Keep this file as the tensor-split
# RETRY template: when #27858 lands in a beellama release, flip to
# --split-mode tensor + --tensor-split 1,1 and re-test (tensor decode is ~2x
# faster and might turn the structured +11% over MTP into a real win).
# Revert: re-comment this file, re-uncomment qwen38-vllm.yaml (primary) or
# qwen38-bee-mtp.yaml (beellama MTP endgame).
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-nvfp4-midhigh
spec:
  # https://huggingface.co/esatapedico/Qwen3.8-27B-NVFP4-MTP-GGUF
  # A/B winner over cdiamond iMatrix: NATIVE NVFP4 (GGML type-40 preserved
  # from the unsloth source), MTP head embedded (blk.64, unused by DSpark -
  # the drafter supplies the draft), MID-HIGH = NVFP4 448-tensor backbone +
  # Q8_0 LM head / token embd / MTP head (16.90 GB).
  # sha256 79b032f7a118fb34f1445c4d7ae50bc7b304c74161035c3df8bd5526c12899b9f
  source: hf://esatapedico/Qwen3.8-27B-NVFP4-MTP-GGUF
  files:
    - Qwen3.8-27B-NVFP4-MTP-MID-HIGH.gguf
    - mmproj-BF16.gguf
  format: gguf
  quantization: NVFP4
  mmproj: mmproj-BF16.gguf
  sourceSecretRef:
    name: hf-token
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 2
      layers: -1 # All
      memory: 16Gi # Per GPU
  resources:
    cpu: "6"
    memory: 16Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-dspark-draft
spec:
  # https://huggingface.co/Anbeeld/Qwen3.8-27B-DSpark-GGUF
  # Anbeeld = beellama's author; GGUF of RadixArk/Qwen3.8-27B-DSpark (1.86B,
  # BF16 source 3.7 GB). Ladder Q2_K..Q8_0/bf16; measured sizes Q2_K 1.09 /
  # Q3_K_M 0.98 / Q4_K_M 1.05 GB - the flat-ladder pattern from the DFlash2
  # A/B (high-precision lm head dominates), so Q4_K_M costs ~0 for accuracy:
  # it keeps the Markov confidence head precise at 0.52 GB/rank. Fallback if
  # OOM: Q3_K_M (~0.98 GB, only ~70 MB less).
  source: hf://Anbeeld/Qwen3.8-27B-DSpark-GGUF
  files:
    - Qwen3.8-27B-DSpark-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  sourceSecretRef:
    name: hf-token
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 2
      layers: -1
      memory: 4Gi # Per GPU, draft only
  resources:
    cpu: "2"
    memory: 4Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38
spec:
  # Fork of qwen38-bee-mtp.yaml (the tuned beellama MID-HIGH winner) with the
  # speculation mechanism swapped: MTP k=3 -> DSpark block-diffusion drafter.
  # Everything else (target, KV, batch, split, ctx, sampling) is identical so
  # the A/B isolates the drafter.
  modelRef: qwen38-nvfp4-midhigh
  runtimeClassName: ${gpu_runtime_class}
  runtime: llamacpp
  # BeeLlama image https://github.com/Anbeeld/beellama.cpp
  # Stable v0.4.7 tag - the release whose fork implements the DSpark draft
  # family (KVarN-qualified non-MLA DSpark contexts, parallel draft ubatch)
  # renovate container:
  image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-preview-v0.5.0
  replicas: 1
  endpoint:
    port: 8080
    type: ClusterIP
  priority: high
  evictionProtection: false
  contextSize: 262144 # -c
  flashAttention: true # -fa
  parallelSlots: 1 # -np
  cacheTypeCustomK: kvarn5
  cacheTypeCustomV: kvarn5
  batchSize: 2048 # -b
  uBatchSize: 512 # -ub
  reasoningBudget: 8096 # Necessary for models like Qwen
  nodeSelector:
    nvidia.com/gpu.present: "true"
  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: HF_TOKEN
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  speculativeDecoding:
    # Typed DSpark: emits --spec-type draft-dspark + -md <staged draft path>.
    # nDraftMax OMITTED on purpose: the fork clamps to the drafter's trained
    # limit (block_size 7 -> 6) when omitted; the drafter's Markov selector
    # decides actual depth per step, so an explicit cap only hurts.
    type: draft-dspark
    draftModelRef: qwen38-dspark-draft
  extraArgs:
    - --alias
    - qwen38_27B
    # Log level
    - -lv
    - "4"
    # Draft KV: KVarN is runtime-qualified for non-MLA DSpark contexts.
    # kvarn4 = the audited DSpark draft-cache width (matches the MTP
    # draft-cache sizing from qwen38-bee-mtp.yaml). f16/q8_0/q4_0/kvarn5
    # were all tried during the tensor-split crash hunt and crash identically
    # - the cache type is not the cause (see TENSOR SPLIT CRASH header).
    - --spec-draft-type-k
    - kvarn4
    - --spec-draft-type-v
    - kvarn4
    # Keep the drafter's five full-attention layers on the GPUs
    - --spec-draft-ngl
    - all
    # LAYER split, not tensor: the DFlash/DSpark draft graphs abort under
    # --split-mode tensor on 2-GPU CUDA (llama.cpp #27819 - reproduced on
    # 2x 5060 Ti; layer mode is the documented workaround). Flip back to
    # tensor + --tensor-split 1,1 when beellama ships the #27858 fix.
    - --split-mode
    - layer
    - -ngl
    - all
    # 1024-token exact BF16 tail on the quantized target KV cache
    - --kv-tail-tokens
    - auto
    # Recurrent state checkpoints: default 32 wastes VRAM; 4 is enough for
    # spec rollback on the GDN layers
    - --ctx-checkpoints
    - "4"
    - --reasoning
    - "on"
    - --reasoning-effort
    - "medium"
    - --reasoning-format
    - "deepseek"
    - --jinja
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --min-p
    - "0.00"
    - --top-k
    - "20"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --fit
    - "off" # explicit pool sizing (fit params are not implemented for
      # SPLIT_MODE_TENSOR anyway; we keep explicit ctx/batch sizing)
    # KV cache fully in VRAM (upstream --cache-ram: 0 disables the host-RAM
    # prompt cache) - vLLM-style hot pool: boot warms from the PVC-cached
    # weights + default --warmup, then the pool grows on demand. Note this
    # also keeps --cache-idle-slots off (it requires a cache-ram budget).
    - --cache-ram
    - "0"
    # mmproj stays in CPU RAM (upstream default is GPU offload, ~0.89 GB for
    # this 931 MB projector) - we only pay the CPU projector path when a
    # vision request actually arrives
    - --no-mmproj-offload
    - --load-mode
    - "none" # No mmap or mlock
    - --chat-template-kwargs
    - '{"preserve_thinking": true}'

  resources:
    gpu: 2
    cpu: "4"
    gpuMemory: 30Gi
    hostMemory: 10Gi
    memory: 12Gi
