# vLLM A/B candidate for the Qwen 3.8 27B agentic service.
#
# Recipe source: https://github.com/skrodahl/qwen38-27B-dual-rtx5060 - measured
# on IDENTICAL hardware (2x RTX 5060 Ti 16 GB, TP2, stock vLLM 0.30.0):
#   - prose decode 78.3 t/s (MTP k=4) vs 41.9 no-MTP, structured/JSON 124.9 t/s
#     (acceptance 4.35 tokens/step vs 2.73 on prose)
#   - full 262144 context fits (278,927-token fp8 KV pool at k=4)
#   - depth analysis: tok/s = steps/s x acceptance; steps/s falls with context
#     (KV re-read per step), prose peaks at k=4, structured still rising at k=7
#   - prefix caching + chunked prefill for repeated agentic system prompts
#
# This file is the ENABLED primary Qwen 3.8 service (InferenceService name
# `qwen38`) - it REPLACES the beellama qwen38 service in
# resources/kustomization.yaml. The beellama version (qwen38-bee-mtp.yaml)
# is commented out so the two don't compete for the same 2x 16 Gi GPUs.
# To revert to beellama: swap the two entries back in resources/kustomization.yaml
# and update the Model health checks in ks.yaml (qwen38-vllm-nvfp4 ->
# qwen38-dflash-27b).
#
# Wired as a drop-in for the existing clients (litellm + karaseek hit
# qwen38.ai.svc.cluster.local:8080, model `qwen38_27B`, dummy key), so:
#   - Service name is `qwen38` (operator names the Service after the
#     InferenceService), port 8080
#   - served-model-name is `qwen38_27B` (matches --alias on the beellama svc)
#   - NO --api-key (beellama is keyless; litellm/karaseek send a dummy key)
#
# Checkpoint: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090 pinned to commit
# 0cc2795 (revision-pinned hf:// source - the operator stages that exact
# commit; `main` is the last release WITHOUT the MTP head, which kills
# speculative decoding and halves the decode ceiling to ~42 t/s).
#
# Quality caveat: third-party NVFP4 quant, NO published eval (the recipe
# author reports 250K needle pass). The A/B must include a quality probe
# (hard reasoning prompt + a JSON/tool-call generation, diff vs the beellama
# service's answer) before considering this a primary replacement.
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-vllm-nvfp4
spec:
  # https://huggingface.co/gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
  # ~18.8 GB NVFP4 safetensors (17.91 GB weights + MTP head), pinned to the
  # last commit that includes the MTP head.
  # NOTE: revision-pinning is REQUIRED - later commits dropped the head.
  source: hf://gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090@0cc27958cefbbe231782ec8511de8c4eb5233348
  # Every file the recipe's download covers: config + quant config + shards +
  # tokenizer + chat template. vLLM loads the staged directory, so the set
  # must be complete (format != gguf -> the operator hands vLLM the directory).
  files:
    - config.json
    - generation_config.json
    - hf_quant_config.json
    - model.safetensors.index.json
    - model-00001-of-00003.safetensors
    - model-00002-of-00003.safetensors
    - model-00003-of-00003.safetensors
    - tokenizer.json
    - tokenizer_config.json
    - vocab.json
    - merges.txt
    - chat_template.jinja
    - preprocessor_config.json
    - processor_config.json
    - video_preprocessor_config.json
  format: safetensors
  quantization: NVFP4
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 2
      layers: -1 # All
      memory: 16Gi # Per GPU
  resources:
    cpu: "6"
    memory: 16Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38
spec:
  modelRef: qwen38-vllm-nvfp4
  runtimeClassName: ${gpu_runtime_class}
  runtime: vllm
  # Stock image, no patches (the recipe's exact version; operator default is
  # v0.25.1, which predates the sm_120 kernel fixes this recipe relies on)
  # renovate container:
  image: vllm/vllm-openai:v0.32.0
  replicas: 1
  endpoint:
    # Port 8080 to match the beellama service + litellm/karaseek clients
    # (qwen38.ai.svc.cluster.local:8080)
    port: 8080
    type: ClusterIP
  priority: high
  evictionProtection: false
  # --max-num-seqs 2 (the recipe's value: OpenCode main agent + one
  # background request)
  parallelSlots: 2
  vllmConfig:
    tensorParallelSize: 2
    # Full native context: the recipe measured 278,927-token KV pool at
    # gpu-memory-utilization 0.95 + MTP k=4, so 262144 fits with 1.06x
    # per-request headroom
    maxModelLen: 262144
    # NVFP4 KV: 4-bit data + E4M3 scale groups - ~1.6x pool over fp8,
    # halves the attention KV re-read per step at depth.
    # Goes through llmkube's unvalidated custom escape hatch (the standard
    # kvCacheDtype field's CRD enum is auto;fp8_e5m2;fp8_e4m3 - nvfp4 is
    # rejected at apply time): kvCacheCustomDtype maps to --kv-cache-dtype
    # and takes precedence over kvCacheDtype, which is left unset (its
    # injected default "auto" is not emitted, so no flag clash).
    kvCacheCustomDtype: nvfp4
    # TRIGGER FIRED 2026-10-19 (was MARK 2026-09-27 "WAITING ON
    # UPSTREAM"): SM120 NVFP4 KV cache shipped in v0.32.0 (the image
    # Renovate bumped 2026-10-18):
    #   - vLLM #46963 (merged 2026-10-07): FlashInfer paged slot-mapping
    #     NVFP4 writer + native FA2 prefill for SM8x/SM12x
    #   - vLLM #60452 (merged 2026-10-10): XQA decode for NVFP4 on
    #     SM12x + MTP verify steps count as decodes again under
    #     UNIFORM_BATCH cudagraphs. Pre-#60452, MTP + NVFP4 on SM120
    #     TP2 collapsed to ~15 tok/s; #60452's field validation is our
    #     exact setup (SM120 TP2, Qwen3.8-27B, MTP): GSM8K 0.962 nvfp4
    #     = 0.962 fp8, no invalid responses.
    # The old marker's VLLM_KV_CACHE_LAYOUT=HND env is OBSOLETE: HND was
    # a requirement of jethac's UNMERGED #46329 line; the merged line is
    # validated on the default NHD layout (head_dim 256, GQA 6, K/V
    # scales strided). Keep PIECEWISE (safe mode for XQA decode).
    # Expect ~1.6x pool over the 0.32.0 fp8 287,719 (~450K+) at a
    # decode-speed cost (dual-5060Ti datapoint: max tg 82 -> 65).
    # A/B RESULT 2026-10-19 (zero concurrency, pod qwen38-7ccfb97d,
    # vs recorded 0.30.0 fp8 b12x baseline): pool 488,973 tok = 1.87x
    # of 262K (+75% over fp8) | short prose 53.7 t/s (-19% vs 66.3) |
    # structured 75.1-77.9 t/s, acc 2.08 (-28 to -30% vs 108.1/2.64)
    # | long COLD 31.58s @68.6K (prefill 2,171 t/s, +4.6%) | warm
    # 3.34s (vs 3.16s, wash) | quality math+tool PASS. KEPT - the pool
    # win is the goal. CONFOUND: no 0.32.0+fp8 paired baseline, so the
    # t/s delta includes the 0.30->0.32 engine bump (XQA decode).
    # Residual caveats: split-KV disabled for NVFP4 prefill, KV writer
    # per-append host sync (flashinfer#6204 pending), head_size 64 /
    # attention-sink models refused (n/a for this model). REVERT = drop
    # kvCacheCustomDtype + restore kvCacheDtype: fp8_e4m3. Detail:
    # docs/notes/llm-journey.md (NVFP4-KV A/B section + Watch list).
    # Repeated agentic system prompts: the big agentic win over the beellama
    # service (which runs --cache-ram 0 and re-prefills every request)
    enablePrefixCaching: true
    enableChunkedPrefill: true
    # 8192 measured: no speed gain and caps context at 200K
    maxNumBatchedTokens: 4096
    # Above 0.91 OOMs *if* batched tokens is raised to 8192
    gpuMemoryUtilization: 0.95
    # FlashInfer: the recipe measured TRITON_ATTN at -33% (32K ctx) / -64%
    # (131K ctx) - the fused multi-step draft path is worth ~0.7%,
    # FlashInfer's attention kernel is worth 2.8x at depth
    attentionBackend: FLASHINFER
    # Tokenizer follows the @revision of the Model source automatically
    hfTokenSecretRef:
      name: hf-token
      key: HF_TOKEN
  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: HF_TOKEN
    # Expandable segments: avoids fragmentation OOM at high utilization
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "expandable_segments:True"
    # Allow max-model-len 262144 past the model's native 262144 RoPE bound
    # checks
    - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
      value: "1"
    # Shrink the lazily-allocated FlashInfer attention workspace (64 MiB):
    # the default 128 MiB is allocated OUTSIDE the gpu-memory-utilization
    # budget on first request and OOMs at 0.95 (recipe's measured gotcha)
    - name: VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE
      value: "67108864"
    # No P2P on GeForce: let NCCL do the all-reduce instead of the custom
    # all-reduce backend (which dies with 'invalid argument' on this host
    # class)
    - name: NCCL_P2P_DISABLE
      value: "1"
  extraArgs:
    # Embedded-head MTP speculative decoding, k=4. NOT expressible via
    # vllmConfig.speculative (that field is the separate-draft-model form
    # --speculative-model only): the draft head lives inside the checkpoint,
    # so vLLM needs the method form.
    # k=4 = measured peak for prose (78.3 t/s) and mixed prose+JSON (81.6
    # t/s). DEEP-K A/B HISTORY (same box, b12x, scripts/llm_bench.py,
    # zero concurrency, pod qwen38-74685b859-2vgjk, 2026-09-28):
    #   k=4: short prose 7.73 s (66.3 t/s) | structured 108.1 t/s, accept
    #        2.64 | pool 279,726
    #   k=6: short prose 8.68 s (59.0 t/s, -11%) | structured 84.4-85.4
    #        t/s, accept 2.36 (-22%) | pool 273,333 (1.04x of 262K, still
    #        fits) | 74.4K prefill 37.2 s = 2000 t/s (k=4: 2076 t/s -
    #        prefill wash) | warm 3.62 s | quality math+tool PASS
    #   per-pos acceptance k=6 (mixed traffic): 0.76/0.54/0.40/0.29/
    #   0.23/0.18 - the curve is healthy, the per-STEP COST is not
    #   (vLLM: MTP layer runs forward multiple times for k>1; FLASHINFER
    #   rebuilds attention metadata between draft steps - both scale with
    #   k). VERDICT: k=6 LOSES on both prose and structured -> k=4 stays.
    #   The recipe's "structured still rising at k=7" (cutlass, their
    #   hardware) did not transfer - same class as the beellama nDraftMax
    #   8 non-transfer. RETRY trigger: FLASHINFER fused multi-step draft
    #   (vLLM #55292/#57443) lands - it removes the per-draft-step
    #   overhead that kills deep k; re-A/B k=6/8 then.
    - --speculative-config
    - '{"method": "mtp", "num_speculative_tokens": 4}'
    # A/B COMPLETE 2026-09-28: FULL_AND_PIECEWISE vs PIECEWISE (b12x + k=4,
    # pod qwen38-7c5c564449-xn7kf). FULL: pool 276,529 (-3.2K) | prose
    # 7.81 s (65.6 t/s vs 66.3) | structured 105.1-106.7 t/s, accept 2.51
    # (vs 108.1, 2.64) | 64.7K COLD 30.23 s = 2141 t/s (vs 2075 -
    # prefill +3.2%) | warm 2.97 s | quality PASS. The +2.4% steps/s did
    # NOT convert to tok/s even under b12x - re-confirms the pre-b12x
    # verdict (no decode gain, pool cost). REVERTED to PIECEWISE: the 3%
    # prefill gain is not worth -3.2K pool + slightly softer decode (the
    # cold-prefill time is dominated by the KV bandwidth wall either
    # way). Caveat: the PIECEWISE comparison numbers are day-old
    # recordings (GPU clock-state confound); a strict same-day
    # re-baseline would need another round trip, and the re-confirming
    # direction makes it unnecessary.
    - --compilation-config
    - '{"cudagraph_mode": "PIECEWISE"}'
    # ---- SM120 b12x NVFP4 GEMM (tested 2026-09-28, ENABLED) ----
    # The running service is on auto, which picked
    # FlashInferCutlassNvFp4LinearKernel (verified in the pod log:
    # "Using FlashInferCutlassNvFp4LinearKernel for NVFP4 GEMM"). The
    # b12x CuTe-DSL warp-level MMA GEMM (FlashInferB12xNvFp4LinearKernel)
    # is the SM120-specific kernel and IS available in the v0.30.0 image
    # (is_supported()=True on the live pod; can_implement is
    # unconditional, same modelopt layout as cutlass), but auto ranks
    # cutlass above it in _POSSIBLE_NVFP4_KERNELS, so it is opt-in
    # (enabled below). Do NOT add enable_flashinfer_autotune to the
    # JSON - the --no-enable-flashinfer-autotune flag is merged in
    # after the parse and specifying both is a hard error.
    # A/B TESTED 2026-09-28 (scripts/llm_bench.py, both configs, same
    # content, zero concurrency in either window):
    #   b12x: pool 279,726 | prose 7.73 s | structured 108.1 t/s,
    #         accept 2.64 | 65.7K cold 31.66 s | warm 3.16 s
    #   cutlass: pool 278,927 | prose 7.90 s | structured 94.0 t/s,
    #            accept 2.32 | 68.6K cold 32.65 s | warm 3.15 s
    #   quality: math 70336 + get_weather PASS on BOTH
    # VERDICT: b12x WINS on structured (+15%, +0.32 accept - the GEMM
    # numerics preserve MTP draft->target agreement better), ties
    # everywhere else, pool invariant. The earlier "wash-to-negative"
    # read was a prompt-content confound (123 t/s was a different JSON
    # prompt; on this prompt cutlass reaches 94 t/s). ENABLED
    # 2026-09-28 (uncommented below). To keep the cutlass baseline
    # instead: re-comment the 2 lines. Full history:
    # docs/notes/llm-journey.md (b12x section).
    # SM120 b12x CuTe-DSL warp-level MMA NVFP4 GEMM - the SM120-specific
    # kernel; auto ranks CUTLASS above it, this opts in.
    - --kernel-config
    - '{"linear_backend": "flashinfer_b12x"}'
    # FlashInfer autotune OOMs on vLLM > 0.28.0; disabling it also frees the
    # headroom to run gpu-memory-utilization 0.95
    - --no-enable-flashinfer-autotune
    # GeForce P2P: NCCL all-reduce instead of the custom backend
    - --disable_custom_all_reduce
    # GDN recurrent (mamba) state at bf16 instead of the fp32 default:
    # halves mamba pages (+22% KV pool), output bit-identical
    - --mamba-cache-dtype
    - bfloat16
    - --mamba-ssm-cache-dtype
    - bfloat16
    # Load weights from the IPC-shared cache between TP workers
    - --load-format
    - ipc_cache
    # Model name must match the beellama --alias (qwen38_27B) so litellm
    # (model openai/qwen38_27B) and karaseek (INFERENCE_TEXT_MODEL) work
    # unchanged
    - --served-model-name
    - qwen38_27B
    # Qwen3 reasoning + tool-call parsing (the beellama service's equivalent
    # is --reasoning on + --reasoning-effort; the A/B prompt should pin
    # reasoning effort explicitly to keep both runs comparable)
    - --reasoning-parser
    - qwen3
    - --tool-call-parser
    - qwen3_xml
    - --enable-auto-tool-choice
    # Keep the thinking trace across turns (agentic context continuity),
    # same intent as the beellama service's chat-template-kwargs
    - --default-chat-template-kwargs
    - '{"preserve_thinking": true}'
    # Vision: keep the tower loaded (text deployment), disable video input;
    # NOTE: do NOT set an "image" cap here - it caps images per
    # CONVERSATION (clients resend history every turn) and a 3rd image 400s
    - --limit-mm-per-prompt
    - '{"video": 0}'
    - --mm-processor-kwargs
    - '{"max_pixels": 1000000}'
    # Per-request observability:
    # --enable-log-requests logs each request START (id + SamplingParams).
    # There is NO per-request finish line in this build - completion/timing
    # is Prometheus-only (request_* histograms, scraped by the
    # llmkube-inference PodMonitor). The 10s engine stats lines stay the
    # always-on rolling view.
    # --per-request-spec-decode-metrics detailed is NOT a log flag either:
    # it populates the vllm:spec_decode_num_accepted_tokens_per_pos_total
    # Prometheus counter (per-position MTP acceptance) and attaches
    # per-request stats to responses. 'detailed' is what unlocks the
    # per-position series.
    - --enable-log-requests
    - --per-request-spec-decode-metrics
    - detailed
    # NOTE: no --api-key - the beellama service is keyless and litellm/karaseek
    # send a dummy key; the Service is ClusterIP + SSO-fronted like beellama.
  # --trust-remote-code deliberately omitted: vLLM deprecates it and Qwen3.8
  # (qwen35 arch) is natively supported - vLLM only warns. Add it back as the
  # first thing to try if the pod fails at boot with a model-architecture
  # error.

  # Increase /dev/shm size otherwise it is unable to deploy
  extraVolumeMounts:
    - name: &shm shm
      mountPath: /dev/shm
  extraVolumes:
    - name: *shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  resources:
    gpu: 2
    cpu: "4"
    gpuMemory: 30Gi
    hostMemory: 12Gi
    memory: 12Gi
  nodeSelector:
    nvidia.com/gpu.present: "true"
