  - qwen38-vllm.yaml # PRIMARY (b12x NVFP4 GEMM enabled 2026-09-28)
  # - qwen38-bee-mtp.yaml # beellama endgame (tested 2026-09-28: structured 85 t/s > DSpark-bee 45 t/s, short ~55 t/s < vLLM 72) - fallback only
