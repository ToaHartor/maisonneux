# SGLang A/B candidate for the Qwen 3.8 27B agentic service.
#
# Recipe sources:
#   - Official LMSYS cookbook: https://lmsysorg.mintlify.app/cookbook/autoregressive/Qwen/Qwen3.8-27B
#     (all 202 config cells validated on v0.5.19: 5 checkpoints x spec
#     options x tiers x GDN state dtypes, full 1319-q GSM8K per cell,
#     93.18-95.15% - including SM120 re-measured on v0.5.19)
#   - DSpark drafter card: https://huggingface.co/RadixArk/Qwen3.8-27B-DSpark
#     (1.86B BF16 draft, gamma=7, verify 8; H200 c=1: AR 94 -> MTP 180
#     (1.91x) -> DSpark v2 297 t/s (3.16x); acceptance-length RULER-8K
#     6.30 = FLAT across context, the profile MTP does NOT have)
#
# What SGLang adds over our running vLLM service (the comparison targets):
#   - DSpark parallel block drafting: no per-position cost (vLLM MTP k=4
#     pays 2.37 ms/position); 3.16x over AR on H200, still leading at c=32
#   - NVFP4 KV cache SHIPS IN SGLANG TODAY (v0.5.20 source-verified below)
#     while the vLLM equivalent is still open upstream PRs (#46329/#56550)
#     - that is why the NVFP4-KV experiment happens here, not in vLLM
#   - RadixAttention prefix caching (on by default; --disable-radix-cache
#     would turn it off - there is no opt-in flag)
#   - DFlash2 SGLang variant (incoai/Qwen3.8-27B-DFlash2): 4.92 ms median
#     TPOT @ 4.29 accept on RTX 5090
#
# == CURRENT STAGING: DSpark NVFP4 draft + NVFP4 KV cache ==
#
# Verified against SGLang v0.5.20 source (not just the cookbook):
#   - `--kv-cache-dtype nvfp4` ships NVFP4KVCacheMethod:
#       prefill -> flashinfer DEQUANT_WORKSPACE (the FP4 pool dequants
#                 into an FP8 workspace that FlashInfer paged attention reads)
#       decode  -> trtllm_mha NATIVE_FP4 (XQA decode; XQA is explicitly
#                 enabled for SM90/SM120 in trtllm_mha_backend.py)
#   - The SM120 hybrid-GDN backend gate allows exactly {triton,
#     trtllm_mha, flashinfer} for BOTH prefill and decode - so the
#     required pair (prefill=flashinfer + decode=trtllm_mha) is legal
#     on the 5060 Ti.
#   - DSpark: `--speculative-algorithm DSPARK` +
#     `--speculative-draft-model-path` is first-class; the drafter's
#     arch Qwen3DSparkModel ships as an SGLang model class, and the
#     draft runs as a full quant-aware model runner, so the drafter's
#     own hf_quant_config.json (modelopt NVFP4, attention/markov/
#     confidence heads excluded) is what the loader consumes.
#
# RISK ledger (the boot log is the arbiter - capture the full traceback
# on any failure; the previous EAGLE attempt died with an unexplained
# 128/256 tensor mismatch whose location - target load vs EAGLE draft
# load - was never pinned down):
#   1. If that 128/256 was in TARGET loading (our gittensor all-NVFP4
#      attention map is NOT in the cookbook's validated set - its NVFP4
#      exports have FP8 attention projections), DSpark inherits the
#      failure; if it was in the EAGLE draft path, DSpark sidesteps it.
#   2. NVFP4-KV + DSpark + SM120 is unmeasured anywhere: the cookbook
#      ran NVFP4 targets on the 5090 with fp8 KV and the BF16 DSpark
#      draft. The native-FP4 XQA decode kernel is claimed, not proven.
#   3. Pool pins (mamba-full-memory-ratio 11.93 bf16-state, mem-fraction
#      0.88) are the cookbook's 32GB single-GPU DSpark measurements; the
#      NVFP4 draft frees ~1.2 GB/rank vs the BF16 one, so expect
#      headroom - bump memFractionStatic if the pool line clamps < 262K.
#
# KNOWN UNKNOWN: the cookbook's matrix is single-GPU only (H200 / RTX PRO
# 6000 / 5090 / DGX Spark). Our 2x 16 GB needs TP2, which the cookbook
# does not cover - watch the boot log for TP2-specific failures.
#
# This file is an ALTERNATE for qwen38-vllm.yaml - only ONE of
# {qwen38-vllm.yaml, qwen38-sglang.yaml, qwen38-dflash.yaml} may be
# enabled in resources/kustomization.yaml at a time: they all declare
# InferenceService `qwen38` and need the same 2 GPUs. The Model CR in
# this file is byte-identical to the one in qwen38-vllm.yaml (kustomize
# dedupes identical resources when both files are enabled; it is present
# here so the sglang file stands alone when the vllm file is off).
#
# Wired as a drop-in like the vLLM service: Service `qwen38` port 8080,
# served-model-name `qwen38_27B`, NO --api-key (keyless, like beellama;
# litellm/karaseek send a dummy key).
#
# Checkpoint: same gittensor NVFP4 Model CR as the vLLM service
# (qwen38-vllm-nvfp4, revision-pinned for the MTP head - the head is
# irrelevant to DSpark but the pin keeps the target byte-identical to
# the vLLM service; the headless final build would free ~1 GB if we ever
# go SGLang-only). SGLang auto-detects the modelopt FP4 quantization
# from the staged checkpoint config; no --quantization flag needed.
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-vllm-nvfp4
spec:
  # https://huggingface.co/gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
  # ~18.8 GB NVFP4 safetensors (17.91 GB weights + MTP head), pinned to the
  # last commit that includes the MTP head.
  # NOTE: revision-pinning is REQUIRED - later commits dropped the head.
  source: hf://gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090@0cc27958cefbbe231782ec8511de8c4eb5233348
  # Every file the recipe's download covers: config + quant config + shards +
  # tokenizer + chat template. SGLang loads the staged directory.
  files:
    - config.json
    - generation_config.json
    - hf_quant_config.json
    - model.safetensors.index.json
    - model-00001-of-00003.safetensors
    - model-00002-of-00003.safetensors
    - model-00003-of-00003.safetensors
    - tokenizer.json
    - tokenizer_config.json
    - vocab.json
    - merges.txt
    - chat_template.jinja
    - preprocessor_config.json
    - processor_config.json
    - video_preprocessor_config.json
  format: safetensors
  quantization: NVFP4
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 2
      layers: -1 # All
      memory: 16Gi # Per GPU
  resources:
    cpu: "6"
    memory: 16Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38
spec:
  modelRef: qwen38-vllm-nvfp4
  runtimeClassName: ${gpu_runtime_class}
  runtime: sglang
  # v0.5.20-cu130: v0.5.19 validated the Qwen3.8 cookbook cells; v0.5.20
  # adds the DSpark NVFP4-draft loader work and ships the NVFP4 KV recipe
  # (nvfp4/fp4_mx_block16 in --kv-cache-dtype). Operator default is
  # v0.5.15.post1-cu129, which predates Qwen3.8 support.
  # renovate container:
  image: lmsysorg/sglang:v0.5.20-cu130
  replicas: 1
  endpoint:
    # Port 8080 to match the vllm/beellama services + litellm/karaseek
    # clients (qwen38.ai.svc.cluster.local:8080)
    port: 8080
    type: ClusterIP
  priority: high
  evictionProtection: false
  # OpenCode main agent + one background request
  parallelSlots: 2
  sglangConfig:
    # Auto-derived from gpuCount=2 anyway; explicit to stay readable
    tensorParallelSize: 2
    # Full native context
    contextLength: 262144
    # Cookbook's 32GB DSpark pin was 0.88 (bf16 state, BF16 3.7 GB draft,
    # 5090 single-GPU). Our draft is 1.41 GB NVFP4 -> ~1.2 GB/rank free vs
    # that pin; NVFP4 KV halves the per-token bytes too. Start one notch up
    # and let the boot pool line arbitrate: raise toward 0.95 if the pool
    # clamps below 262K tokens, drop to 0.85 on OOM at graph capture.
    memFractionStatic: 0.90
    # 8192 chunks stall GDN decode steps ~600 ms each (cookbook); 2048
    # keeps inter-token latency smooth under mixed agentic load
    chunkedPrefillSize: 2048
    # NVFP4 KV cache: 'nvfp4' is NOT in the CRD's kvCacheDtype enum
    # (auto/fp8_e5m2/fp8_e4m3) - kvCacheCustomDtype is the operator's
    # escape hatch (unvalidated string, maps to --kv-cache-dtype and takes
    # precedence over kvCacheDtype). ~10 KiB/token/rank (fp4 data + group
    # scales) vs ~16.6 fp8: the pool gets ~1.6x deeper for the same money,
    # at a small decode-speed cost. Datapoint on OUR cards (dual 5060 Ti,
    # #50288 thread, per llm-journey.md NVFP4-KV watch item): max tg
    # 82 (fp8 KV) -> 65 (nvfp4 KV).
    # (The old fp8 pin, for reference when swapping back:)
    # kvCacheDtype: fp8_e4m3
    kvCacheCustomDtype: nvfp4
    # Prefill backend: flashinfer reads the NVFP4 pool through its FP8
    # dequant workspace. The DECODE backend is overridden in extraArgs to
    # trtllm_mha (NATIVE_FP4 XQA decode) - the CRD's attentionBackend enum
    # (flashinfer/flash_attn/torch_native) has no decode-only variant, and
    # trtllm_mha is only legal here because of the SM120 hybrid-GDN gate.*
    # flashinfer does not work with NVFP4
    # attentionBackend: flashinfer
    # RadixAttention prefix caching is ON BY DEFAULT in SGLang (the flag is
    # --disable-radix-cache; there is no opt-in flag to set). The typed
    # enablePrefixCaching field is NOT used: it would emit a flag SGLang
    # does not accept.
    # qwen3 reasoning parser (in the CRD enum). The tool-call parser is
    # qwen3_coder (documented for this checkpoint) - NOT in the CRD enum
    # (llama3/qwen3/qwen25/hermes/functionary/mistral), so it goes via
    # extraArgs below where the last occurrence of a flag wins.
    reasoningParser: qwen3
    # The DSpark card's serve command carries it; keep it
    trustRemoteCode: true
    # GDN state pool concurrency target (cookbook mamba-ratio calculator:
    # pool = concurrency x S slots, S=5 for the extra_buffer radix
    # strategy). Without it the engine auto-sizes the state pool for a
    # much larger default concurrency and the KV pool shrinks.
    maxRunningRequests: 2
    # NOTE: the typed speculative form is NOT used: its algorithm enum is
    # {EAGLE, EAGLE3, Medusa} - no DSPARK - so the whole spec goes via
    # extraArgs below (same established pattern as the vLLM service).
  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: HF_TOKEN
    # Expandable segments: avoids fragmentation OOM at high utilization
    # (cookbook's DSpark serve command carries it)
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "expandable_segments:True"
    # No P2P on GeForce: NCCL all-reduce instead of the custom backend
    # (same gotcha as the vLLM service)
    - name: NCCL_P2P_DISABLE
      value: "1"
    # Static ragged-verify budget (the DSpark card's setting): keep the
    # verify window fixed at gamma+1 instead of cap-accept/compact, which
    # need the SPS cost table + STS calibration the card does not ship.
    - name: SGLANG_RAGGED_VERIFY_MODE
      value: "static"
  extraArgs:
    # Fix for flashinfer not working with nvfp4
    - --decode-attention-backend
    - trtllm_mha
    # trtllm_mha can't be used as prefill attention backend
    # ref -> https://docs.sglang.io/docs/advanced_features/attention_backend#hybrid-attention-different-backends-for-prefill-vs-decode-experimental
    - --prefill-attention-backend
    - flashinfer
    # ---- STAGED: DSpark NVFP4 draft + NVFP4 KV cache ----
    - --speculative-algorithm
    - DSPARK
    # gittensor's NVFP4 v2 drafter (1.41 GB): downloaded from HF at boot
    # (public repo, no HF gate) and re-downloaded on every pod restart -
    # same trade as the vLLM DSpark candidate. Pinned to the revision the
    # vLLM DSpark file validated against.
    - --speculative-draft-model-path
    - gittensor-model-hub/Qwen3.8-27B-DSpark-NVFP4
    - --speculative-draft-model-revision
    - eba1ac5a66c74902eaa95a4000a7c5eda96d8e95
    # The drafter ships its own hf_quant_config.json (modelopt NVFP4,
    # group 16; attention projections + markov/confidence heads + fc
    # excluded). State the method explicitly instead of relying on the
    # inherit-from-target default.
    - --speculative-draft-model-quantization
    - modelopt_fp4
    # gamma = 7 (verify window 8) - the checkpoint's block_size, pinned
    # explicitly instead of auto-inference.
    - --speculative-dspark-block-size
    - "7"
    # One draft round of the gamma block per verify step
    - --speculative-num-steps
    - "1"
    # NVFP4 KV decode half: trtllm_mha NATIVE_FP4 XQA decode (XQA is
    # enabled for SM120). Prefill stays flashinfer (typed
    # attentionBackend) reading the FP8 dequant workspace.
    - --decode-attention-backend
    - trtllm_mha
    # GDN state pool at bf16 instead of the fp32 default: halves the
    # 153.9 MB/slot state pool to 78.4 MB, the difference goes to KV
    # (cookbook: "bfloat16 remains the faster choice regardless")
    - --mamba-ssm-dtype
    - bfloat16
    # DSpark pool pin, cookbook's measured 32GB-card value (bf16 state,
    # extra_buffer S=5, D=8): r = (S + D) x token_equiv / L. The NVFP4
    # draft frees ~1.2 GB/rank vs the BF16 draft the pin was measured on
    # - if the pool line shows headroom, the ratio can come down later.
    - --mamba-full-memory-ratio
    - "11.93"
    - --mamba-radix-cache-strategy
    - extra_buffer
    # Model name must match the vLLM/beellama alias so litellm
    # (model openai/qwen38_27B) and karaseek work unchanged
    - --served-model-name
    - qwen38_27B
    # Tool-call parser: qwen3_coder (the cookbook's parser for this
    # checkpoint - its chat template nests <function>/<parameter> blocks
    # inside tool_call, which qwen3_coder decodes). The typed field can't
    # take it (not in the CRD enum); extraArgs last-occurrence wins over
    # any typed emission.
    - --tool-call-parser
    - qwen3_coder
    # NOTE: no --api-key - the service is keyless and litellm/karaseek
    # send a dummy key; the Service is ClusterIP + SSO-fronted.
    #
    # ---- FALLBACK A: in-checkpoint MTP via EAGLE (the previous staging) ----
    # Used the MTP head packed in the gittensor checkpoint. This is the
    # config that produced the unexplained 128/256 tensor mismatch on the
    # first attempt - only re-stage it AFTER that traceback is understood
    # (and on a RAM-correct pod).
    #   - --speculative-algorithm
    #   - EAGLE
    #   - --speculative-num-steps
    #   - "3"
    #   - --speculative-eagle-topk
    #   - "1"
    #   - --speculative-num-draft-tokens
    #   - "4"
    #   (no --decode-attention-backend: EAGLE drafts run on the target's
    #    flashinfer backend and read the FP8 dequant workspace fine; drop
    #    trtllm_mha for EAGLE + NVFP4 KV only if the draft KV pool wants
    #    its own dtype via --speculative-draft-kv-cache-dtype)
    #
    # ---- FALLBACK B: DSpark with the BF16 RadixArk draft ----
    # If the NVFP4 drafter fails to load in SGLang, the 3.7 GB BF16 draft
    # is the known-good fallback: it needs a bigger pool (drop
    # memFractionStatic to 0.88, keep mamba-full-memory-ratio 11.93),
    # and the --speculative-draft-model-quantization flag DROPPED (that
    # repo ships no quant config, so the draft loads unquantized by
    # default; 'unquant' is not a valid choice for the flag). The NVFP4
    # draft beats it on ~2.3 GB of VRAM.
    #   - --speculative-draft-model-path
    #   - RadixArk/Qwen3.8-27B-DSpark
    #
    # ---- FALLBACK C: DFlash2 SGLang variant (incoai, NOT the Anbeeld one) ----
    # The llama.cpp DFlash2 collapse at 16K was a 2048-token SWA window;
    # this is a different drafter (block diffusion, 8-token blocks)
    # measured at 4.92 ms median TPOT / 4.29 accept on RTX 5090 -
    # re-test long context to see if the window problem exists here.
    #   - --speculative-algorithm
    #   - DFLASH
    #   - --speculative-draft-model-path
    #   - incoai/Qwen3.8-27B-DFlash2
    #   - --speculative-num-draft-tokens
    #   - "8"
  # Increase /dev/shm size otherwise it is unable to deploy (TP2 NCCL IPC,
  # same requirement as the vLLM service)
  extraVolumeMounts:
    - name: &shm shm
      mountPath: /dev/shm
  extraVolumes:
    - name: *shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  resources:
    gpu: 2
    cpu: "4"
    gpuMemory: 30Gi
    hostMemory: 14Gi # SGLang TP2 needs more host RAM than expected; corrected 2026-09-27
    memory: 14Gi
  nodeSelector:
    nvidia.com/gpu.present: "true"
