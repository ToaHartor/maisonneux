    operation: copy
  ref:
    tag: 2.2.17
    digest: sha256:cdaacb1aff0c01e7a580fef9f54a514825055badebdaa1f93c699e2e4aebb302
  url: oci://ghcr.io/stakater/charts/reloader
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/stakater/Reloader.*$"
