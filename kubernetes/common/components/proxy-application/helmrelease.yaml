---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
# Required variables : APP, GROUP, SUBDOMAIN, DESCRIPTION, auth_subdomain, main_domain_websecure
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-proxy
  labels:
    homelab/auth-component: "true"
spec:
  releaseName: ${APP}-proxy
  chart:
    # Vendored chart (helm/common/authentik-application; provenance in
    # its README): the codeberg OCI registry stopped serving anonymous
    # pulls, so the chart now renders directly from this git tree
    spec:
      chart: helm/common/authentik-application
      interval: 12h
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  interval: 50m
  install:
    createNamespace: true
    remediation:
      retries: 3

  values:
    # From helm/common/authentik-application/values.yaml (vendored; provenance in its README)
    blueprint:
      authentik:
        domain: "https://${auth_subdomain}.${main_domain_websecure}"
      provider:
        enabled: true
        name: "${APP}"
        type: "proxy"
        proxy:
          externalHost: &ext-host "https://${SUBDOMAIN}.${main_domain_websecure}"
          skipPathRegex: ""
          cookieDomain: ""
          ingress:
            enabled: false

      application:
        name: "${APP}"
        slug: "${APP}"
        group: "${GROUP}"
        launchURL: *ext-host
        openInNewTab: false
        icon: ""
        description: "${DESCRIPTION}"
        bindPolicyID:
        policyEngineMode: "any"
      groups: []
        # Add groups via patch
