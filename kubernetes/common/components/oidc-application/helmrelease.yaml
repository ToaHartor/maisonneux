---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
# Required variables : APP, GROUP, SUBDOMAIN, DESCRIPTION, REDIRECT_URL, auth_subdomain, main_domain_websecure
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-oidc
  labels:
    homelab/auth-component: "true"
spec:
  releaseName: ${APP}-oidc
  chart:
    # Vendored chart (helm/common/authentik-application; provenance in
    # its README): the codeberg OCI registry stopped serving anonymous
    # pulls, so the chart now renders directly from this git tree
    spec:
      chart: helm/common/authentik-application
      interval: 12h
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  interval: 50m
  install:
    createNamespace: true
    remediation:
      retries: 3

  values:
    # From helm/common/authentik-application/values.yaml (vendored; provenance in its README)
    blueprint:
      authentik:
        domain: "https://${auth_subdomain}.${main_domain_websecure}"
      provider:
        enabled: true
        name: "${APP}"
        type: "oidc"
        oidc:
          clientType: "confidential"
          # clientID:
          # clientSecret:
          redirectURL:
            - "${REDIRECT_URL}"
          tokenDuration: "minutes=5"
          signingKey: "namespace_authentik.secret_authentik-cert-tls.tls"
          scopes:
            - name: "authentik default OAuth Mapping: OpenID 'openid'"
            - name: "authentik default OAuth Mapping: OpenID 'email'"
            - name: "authentik default OAuth Mapping: OpenID 'profile'"
            # Add scopes via
            # - name:
            #   scope_name:
            #   expression:
      application:
        name: "${APP}"
        slug: "${APP}"
        group: "${GROUP}"
        launchURL: "https://${SUBDOMAIN}.${DOMAIN_WEBSECURE}"
        openInNewTab: false
        icon: ""
        description: "${DESCRIPTION}"
        bindPolicyID:
        policyEngineMode: "any"
      groups: []
        # Add groups via patch
