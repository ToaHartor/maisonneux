s3:
  secretName: # bucket-${environment}-s3user
  bucketName: # bucket-${environment}
  endpoint: # http://${minio_url}
  size: 20 # in GB

storage:
  size: 1Gi
  # was a default exported by the common library chart (inlined)
  persistentClassName: default
database:
  enableAntiAffinity: true
  postgres:
    # were defaults exported by the common library chart (inlined)
    clusterName: psql-cluster
    clusterSecretName: postgres-secrets
